<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halcyon Coffee Roasters — Retro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Space+Mono:wght@400;700&display=swap">
  <style>
    :root { --cream:#f4e6c8; --mustard:#f2b33d; --orange:#d9642b; --brown:#5a3a22; --dark:#2e1f14; --olive:#8a9a5b;
            --stripes: linear-gradient(var(--orange) 0 33.3%, var(--mustard) 33.3% 66.6%, var(--brown) 66.6% 100%); }
    *, *::before, *::after { box-sizing: border-box; }
    /* mobile hardening */
    html { -webkit-text-size-adjust: 100%; }
    body { overflow-wrap: break-word; }
    .switcher__panel { max-height: calc(100vh - 6rem); overflow-y: auto; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--cream); color: var(--dark); font-family: 'Space Mono', monospace; font-size: 1rem; line-height: 1.65; }
    body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 100; opacity: .13; mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
    button, input { font: inherit; color: inherit; }
    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3, p { margin: 0; }
    .disp, h1, h2 { font-family: 'Shrikhand', cursive; font-weight: 400; line-height: 1; }
    :focus-visible { outline: 3px dotted var(--orange); outline-offset: 3px; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 clamp(1rem, 4vw, 2rem); }
    .section { padding: clamp(4.5rem, 9vw, 7rem) 0; position: relative; }
    .photo { border-radius: 24px; overflow: hidden; }
    .photo img { width: 100%; height: 100%; object-fit: cover; filter: sepia(.35) saturate(1.2) contrast(.95); }
    h2 { font-size: clamp(2.6rem, 7vw, 5rem); color: var(--brown); text-shadow: 3px 3px 0 var(--mustard); text-align: center; margin-bottom: .5rem; }
    .sub { text-align: center; text-transform: uppercase; letter-spacing: .25em; font-size: .8rem; font-weight: 700; color: var(--orange); margin-bottom: clamp(2.5rem, 5vw, 3.5rem); }
    .sub::before, .sub::after { content: " ★ "; }
    .stripes { height: 36px; background: var(--stripes); }
    .btn { display: inline-block; font-family: 'Shrikhand', cursive; font-size: 1.15rem; padding: .7rem 1.5rem .8rem; border-radius: 999px; background: var(--orange); color: var(--cream); border: 3px solid var(--dark); box-shadow: 0 4px 0 var(--dark); transition: transform .2s; }
    .btn:hover { transform: rotate(-3deg) scale(1.04); }
    .btn--mustard { background: var(--mustard); color: var(--dark); }

    /* nav */
    .site-nav { background: var(--dark); color: var(--cream); position: sticky; top: 0; z-index: 30; }
    .site-nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 1rem; }
    .logo { font-family: 'Shrikhand', cursive; font-size: 1.6rem; color: var(--mustard); text-shadow: 2px 2px 0 var(--orange); }
    .nav-links { display: flex; gap: 1.6rem; list-style: none; margin: 0; padding: 0; text-transform: uppercase; font-size: .82rem; letter-spacing: .15em; font-weight: 700; }
    .nav-links a:hover { color: var(--mustard); }
    .site-nav .btn { font-size: .95rem; padding: .35rem 1rem .45rem; box-shadow: none; border-color: var(--cream); }

    /* hero */
    #hero { position: relative; overflow: hidden; padding: clamp(3rem, 7vw, 5rem) 0 0; background: var(--cream); }
    .sun { position: absolute; left: 50%; top: 58%; width: 1600px; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%;
           background: repeating-conic-gradient(var(--mustard) 0 7.5deg, var(--cream) 7.5deg 15deg); opacity: .55; }
    html.motion .sun { animation: sunspin 90s linear infinite; }
    @keyframes sunspin { to { transform: translate(-50%, -50%) rotate(360deg); } }
    .hero-grid { position: relative; display: grid; grid-template-columns: 1.1fr 1fr; gap: clamp(1.5rem, 4vw, 3rem); align-items: end; }
    .hero-title { font-size: clamp(3.4rem, 9vw, 7.6rem); color: var(--orange); text-shadow: 4px 4px 0 var(--brown), 8px 8px 0 var(--mustard); line-height: .95; overflow-wrap: break-word; }
    .hero-title small { display: block; font-size: .42em; color: var(--brown); text-shadow: 2px 2px 0 var(--mustard); margin-top: .35em; }
    .hero-copy { margin: 1.75rem 0; max-width: 38ch; font-size: 1.05rem; background: var(--cream); padding: .9rem 1.1rem; border: 2px dashed var(--brown); border-radius: 14px; }
    .hero-ctas { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: clamp(2.5rem, 5vw, 4rem); }
    .arch { position: relative; aspect-ratio: 4 / 5; border-radius: 999px 999px 24px 24px; border: 6px solid var(--brown); box-shadow: 10px 10px 0 var(--orange); margin-bottom: 3rem; }
    .arch .photo { width: 100%; height: 100%; border-radius: 999px 999px 18px 18px; }
    .badge { position: absolute; left: -38px; bottom: 30px; width: 132px; height: 132px; border-radius: 50%; background: var(--mustard); border: 4px solid var(--dark); display: grid; place-items: center; z-index: 2; }
    .badge svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    html.motion .badge svg { animation: spin 12s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .badge b { font-family: 'Shrikhand', cursive; font-size: 1.5rem; color: var(--dark); font-weight: 400; line-height: .9; text-align: center; }

    /* marquee */
    .marquee { background: var(--brown); color: var(--mustard); overflow: hidden; padding: .8rem 0; border-block: 4px solid var(--dark); }
    .marquee__track { display: flex; width: max-content; white-space: nowrap; font-family: 'Shrikhand', cursive; font-size: 1.4rem; }
    .marquee__track span { padding-right: 2rem; }
    html.motion .marquee__track { animation: marq 25s linear infinite; }
    @keyframes marq { to { transform: translateX(-50%); } }

    /* about */
    #about { background: var(--brown); color: var(--cream); }
    #about h2 { color: var(--mustard); text-shadow: 3px 3px 0 var(--orange); }
    #about .sub { color: var(--mustard); }
    .about-grid { display: grid; grid-template-columns: 1fr 1.15fr; gap: clamp(2rem, 5vw, 4rem); align-items: center; }
    .about-grid .photo { aspect-ratio: 1; border: 5px solid var(--mustard); }
    .story p + p { margin-top: 1rem; }
    .story p:first-child { font-family: 'Shrikhand', cursive; font-size: 1.5rem; line-height: 1.25; color: var(--mustard); }
    .facts { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 2rem; }
    .fact { width: 118px; height: 118px; border-radius: 50%; display: grid; place-content: center; text-align: center; border: 3px solid var(--cream); padding: .5rem; }
    .fact:nth-child(1) { background: var(--orange); } .fact:nth-child(2) { background: var(--mustard); color: var(--dark); }
    .fact:nth-child(3) { background: var(--olive); } .fact:nth-child(4) { background: var(--cream); color: var(--dark); }
    .fact b { font-family: 'Shrikhand', cursive; font-weight: 400; font-size: 1.5rem; line-height: 1; }
    .fact span { font-size: .62rem; text-transform: uppercase; letter-spacing: .08em; line-height: 1.2; }

    /* menu board */
    .board { background: var(--dark); color: var(--cream); border-radius: 20px; padding: clamp(1.75rem, 4vw, 3rem); position: relative; border: 6px solid var(--brown); box-shadow: 0 0 0 4px var(--mustard), 12px 12px 0 4px var(--orange); }
    .board::before, .board::after { content: ""; position: absolute; top: 50%; width: 36px; height: 36px; border-radius: 50%; background: var(--cream); transform: translateY(-50%); }
    .board::before { left: -24px; } .board::after { right: -24px; }
    .board-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(1.5rem, 4vw, 3rem); }
    .board h3 { font-family: 'Shrikhand', cursive; font-weight: 400; font-size: 1.8rem; color: var(--mustard); margin-bottom: 1rem; border-bottom: 2px dashed var(--mustard); padding-bottom: .5rem; }
    .row { display: flex; align-items: baseline; gap: .4rem; margin-top: .9rem; }
    .row strong { font-weight: 700; text-transform: uppercase; font-size: .9rem; letter-spacing: .04em; overflow-wrap: anywhere; }
    .row .lead { flex: 1; border-bottom: 2px dotted var(--olive); transform: translateY(-4px); min-width: .75rem; }
    .row .p { color: var(--mustard); font-weight: 700; }
    .desc { font-size: .78rem; color: var(--cream); opacity: .75; }

    /* origins postcards */
    #origins { background: var(--mustard); }
    #origins h2 { color: var(--dark); text-shadow: 3px 3px 0 var(--orange); }
    #origins .sub { color: var(--brown); }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(1.5rem, 3vw, 2.5rem); }
    .card { background: var(--cream); border-radius: 10px; padding: 1rem; box-shadow: 6px 6px 0 var(--dark); position: relative; transition: transform .3s; }
    .card:nth-child(1) { transform: rotate(-2deg); } .card:nth-child(3) { transform: rotate(2deg); }
    .card:hover { transform: rotate(0) translateY(-6px); }
    .card .photo { aspect-ratio: 3 / 2; border-radius: 6px; }
    .stamp { position: absolute; right: 1.6rem; top: 1.6rem; background: var(--cream); border: 3px dotted var(--orange); padding: .35rem .45rem; font-size: .62rem; text-align: center; line-height: 1.2; text-transform: uppercase; font-weight: 700; color: var(--orange); transform: rotate(6deg); }
    .card h3 { font-family: 'Shrikhand', cursive; font-weight: 400; font-size: 1.7rem; color: var(--orange); margin: 1rem 0 .3rem; }
    .card .notes { font-weight: 700; color: var(--brown); }
    .card .meta { font-size: .8rem; margin: .6rem 0 1rem; line-height: 1.55; }
    .postmark { display: inline-block; border: 2px solid var(--brown); border-radius: 999px; padding: .15rem .8rem; font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; transform: rotate(-4deg); }
    .card .price { float: right; font-family: 'Shrikhand', cursive; font-size: 1.3rem; color: var(--brown); }

    /* gallery strip */
    .strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1rem; }
    .strip .photo { aspect-ratio: 3 / 4; border: 5px solid var(--cream); box-shadow: 0 0 0 3px var(--brown); }
    .strip .photo:nth-child(even) { transform: translateY(2rem); }

    /* visit */
    #visit { background: var(--dark); color: var(--cream); }
    #visit h2 { color: var(--mustard); text-shadow: 3px 3px 0 var(--orange); }
    .visit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(2rem, 5vw, 4rem); align-items: center; }
    .sign { background: var(--mustard); color: var(--dark); border-radius: 24px; padding: 2rem; border: 5px solid var(--orange); text-align: center; }
    .open { font-family: 'Shrikhand', cursive; font-size: clamp(2.4rem, 6vw, 3.6rem); color: var(--orange); text-shadow: 0 0 12px var(--orange), 0 0 2px var(--cream); line-height: 1; }
    html.motion .open { animation: flicker 4s infinite; }
    @keyframes flicker { 0%, 18%, 22%, 62%, 64%, 100% { opacity: 1; } 20%, 63% { opacity: .55; } }
    .sign table { width: 100%; margin-top: 1.25rem; border-collapse: collapse; font-weight: 700; }
    .sign td { padding: .45rem 0; border-top: 2px dashed var(--brown); }
    .sign td:first-child { text-align: left; } .sign td:last-child { text-align: right; }
    .sign .today td { color: var(--orange); }
    .addr { font-family: 'Shrikhand', cursive; font-size: clamp(1.6rem, 3.5vw, 2.3rem); color: var(--mustard); line-height: 1.15; }
    .visit-grid .photo { aspect-ratio: 16 / 10; margin-top: 1.5rem; border: 4px solid var(--mustard); }

    /* footer */
    footer { background: var(--brown); color: var(--cream); }
    .foot { display: grid; grid-template-columns: 1.3fr 1fr; gap: 2.5rem; padding: clamp(3rem, 7vw, 4.5rem) 0 2rem; align-items: end; }
    .foot h2 { text-align: left; color: var(--mustard); text-shadow: 3px 3px 0 var(--orange); font-size: clamp(2.2rem, 5vw, 3.4rem); }
    .signup { display: flex; gap: .6rem; margin-top: 1.25rem; flex-wrap: wrap; }
    .signup input { flex: 1; min-width: 0; border-radius: 999px; border: 3px solid var(--dark); background: var(--cream); color: var(--dark); padding: .7rem 1.2rem; }
    .socials { list-style: none; margin: 0; padding: 0; display: flex; gap: .75rem; justify-content: flex-end; flex-wrap: wrap; }
    .socials a { display: block; border: 2px solid var(--mustard); color: var(--mustard); border-radius: 999px; padding: .35rem 1rem; font-weight: 700; transition: transform .2s; }
    .socials a:hover { transform: rotate(-4deg); background: var(--mustard); color: var(--dark); }
    .legal { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; padding-bottom: 1.5rem; font-size: .8rem; opacity: .8; }

    .img-failed { background: repeating-linear-gradient(45deg, var(--mustard) 0 16px, var(--orange) 16px 32px); min-height: 240px; color: transparent; }

    html.motion [data-reveal] { opacity: 0; transform: translateY(20px); transition: opacity .8s ease-out, transform .8s cubic-bezier(.2,.8,.2,1); transition-delay: var(--d, 0ms); }
    html.motion [data-reveal].is-in { opacity: 1; transform: none; }
    html.motion .card[data-reveal].is-in:nth-child(1) { transform: rotate(-2deg); }
    html.motion .card[data-reveal].is-in:nth-child(3) { transform: rotate(2deg); }
    html.motion .strip [data-reveal].is-in:nth-child(even) { transform: translateY(2rem); }

    /* switcher */
    .switcher { position: fixed; right: 1rem; bottom: 1rem; z-index: 110; display: flex; flex-direction: column; align-items: flex-end; gap: .6rem; }
    .switcher__toggle { order: 2; background: var(--mustard); color: var(--dark); border: 3px solid var(--dark); box-shadow: 0 0 0 4px var(--brown); border-radius: 999px; padding: .5rem 1.2rem .6rem; font-family: 'Shrikhand', cursive; font-size: 1.05rem; cursor: pointer; }
    .switcher__toggle:hover { background: var(--orange); color: var(--cream); }
    .switcher__panel { order: 1; display: grid; background: var(--cream); border: 3px solid var(--dark); border-radius: 14px; padding: .6rem 1rem; min-width: 220px;
      -webkit-mask: radial-gradient(circle 7px at 50% 0, transparent 98%, var(--dark)) top / 22px 100% repeat-x; mask: radial-gradient(circle 7px at 50% 0, transparent 98%, var(--dark)) top / 22px 100% repeat-x; padding-top: 1rem; }
    .switcher__panel[hidden] { display: none; }
    .switcher__link { padding: .3rem 0; font-weight: 700; text-transform: uppercase; font-size: .82rem; letter-spacing: .08em; border-bottom: 2px dotted var(--mustard); }
    .switcher__link:hover { color: var(--orange); }
    .switcher__link[aria-current="page"] { color: var(--orange); }
    .switcher__link[aria-current="page"]::before { content: "★ "; }
    .switcher__link--all { border-bottom: 0; }

    @media (max-width: 900px) {
      .hero-grid, .about-grid, .visit-grid, .foot { grid-template-columns: 1fr; }
      .board-grid, .cards { grid-template-columns: 1fr; }
      .strip { grid-template-columns: repeat(3, 1fr); }
      .strip .photo:nth-child(even) { transform: none; }
      html.motion .strip [data-reveal].is-in:nth-child(even) { transform: none; }
      .arch { max-width: 420px; margin: 0 auto 3rem; }
      .socials { justify-content: flex-start; }
    }
    @media (max-width: 640px) {
      .nav-links { display: none; }
      .badge { left: -8px; width: 104px; height: 104px; } .badge b { font-size: 1.15rem; }
      .strip { grid-template-columns: repeat(2, 1fr); }
      .board::before, .board::after { display: none; }
      .arch { box-shadow: 6px 6px 0 var(--orange); }
    }
    /* mobile: nav links become a swipeable row */
    @media (max-width: 640px) {
      .site-nav .wrap { flex-wrap: wrap; height: auto; row-gap: .4rem; padding-top: .6rem; padding-bottom: .6rem; }
      .nav-links { display: flex !important; order: 3; width: 100%; overflow-x: auto; gap: 1.25rem; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
      .nav-links::-webkit-scrollbar { display: none; }
      .nav-links li { flex: none; }
    }
    @media (max-width: 640px) { .site-nav .wrap { height: auto; } .nav-links { font-size: .75rem; } }
    @media (max-width: 640px) {
      input { font-size: 16px !important; }
      .switcher { right: .75rem; bottom: .75rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="site-nav" id="top"></header>
  <main>
    <section id="hero"></section>
    <div class="marquee" aria-hidden="true"><div class="marquee__track" id="marquee"></div></div>
    <section id="about" class="section"></section>
    <div class="stripes"></div>
    <section id="menu" class="section"></section>
    <section id="origins" class="section"></section>
    <section id="gallery" class="section"></section>
    <section id="visit" class="section"></section>
  </main>
  <footer id="footer"></footer>

  <script src="../shared/content.js"></script>
  <script src="../shared/images.js"></script>
  <script src="../shared/switcher.js"></script>
  <script>
    (function () {
      var C = window.CAFE, I = window.IMAGES;
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!reduce) document.documentElement.classList.add('motion');
      function img(e, w, eager) { return '<img src="' + window.imgSrc(e, w) + '" alt="' + e.alt + '" loading="' + (eager ? 'eager' : 'lazy') + '" decoding="async">'; }
      function photo(e, w, cls, attrs, eager) { return '<div class="photo ' + (cls || '') + '"' + (attrs || '') + '>' + img(e, w, eager) + '</div>'; }
      function money(p) { return C.currency + p; }
      function $(id) { return document.getElementById(id); }
      function d(i) { return ' data-reveal style="--d:' + (i * 110) + 'ms"'; }
      var today = (function () { var n = new Date().getDay(); return n === 0 ? 2 : n === 6 ? 1 : 0; })();
      var est = C.facts[0].value;

      $('top').innerHTML = '<div class="wrap"><a class="logo" href="#top">' + C.shortName + '</a>' +
        '<ul class="nav-links">' + C.nav.map(function (n) { return '<li><a href="' + n.href + '">' + n.label + '</a></li>'; }).join('') + '</ul>' +
        '<a class="btn" href="#menu">' + C.cta.order + '</a></div>';

      $('hero').innerHTML = '<div class="sun"></div><div class="wrap hero-grid"><div>' +
        '<h1 class="hero-title"' + d(0) + '>' + C.shortName + '<small>' + C.name.replace(C.shortName + ' ', '') + '</small></h1>' +
        '<p class="hero-copy"' + d(1) + '>' + C.tagline + ' Pull up a stool — the kettle\'s always on.</p>' +
        '<div class="hero-ctas"' + d(2) + '><a class="btn" href="#menu">' + C.cta.order + '</a><a class="btn btn--mustard" href="#visit">' + C.cta.visit + '</a></div></div>' +
        '<div class="arch"' + d(1) + '>' + photo(I.hero, 1000, '', '', true) +
        '<div class="badge"><svg viewBox="0 0 100 100" aria-hidden="true"><defs><path id="c" d="M50,50 m-38,0 a38,38 0 1,1 76,0 a38,38 0 1,1 -76,0"/></defs>' +
        '<text font-size="10.5" font-family="Space Mono" font-weight="700" fill="currentColor" letter-spacing="2"><textPath href="#c">FRESH ROASTED ★ SMALL BATCH ★ </textPath></text></svg><b>est.<br>' + est + '</b></div></div></div>';

      var mq = ['Fresh roasted', 'Since ' + est, 'Good vibes & good beans', 'Pour-overs all day'].map(function (t) { return '<span>' + t + ' ★</span>'; }).join('');
      $('marquee').innerHTML = mq + mq + mq + mq;

      $('about').innerHTML = '<div class="wrap"><h2' + d(0) + '>Our Story</h2><p class="sub">Since ' + est + '</p><div class="about-grid">' +
        photo(I.about, 900, '', d(1)) +
        '<div' + d(2) + '><div class="story">' + C.story.map(function (p) { return '<p>' + p + '</p>'; }).join('') + '</div>' +
        '<div class="facts">' + C.facts.map(function (f) { return '<div class="fact"><b>' + f.value + '</b><span>' + f.label + '</span></div>'; }).join('') + '</div></div></div></div>';

      $('menu').innerHTML = '<div class="wrap"><h2' + d(0) + '>The Menu</h2><p class="sub">Served with a smile</p><div class="board"' + d(1) + '><div class="board-grid">' +
        C.menu.map(function (c) {
          return '<div><h3>' + c.category + '</h3>' + c.items.map(function (it) {
            return '<div class="row"><strong>' + it.name + '</strong><span class="lead"></span><span class="p">' + money(it.price) + '</span></div><p class="desc">' + it.desc + '</p>';
          }).join('') + '</div>';
        }).join('') + '</div></div></div>';

      $('origins').innerHTML = '<div class="wrap"><h2' + d(0) + '>Postcards from the farm</h2><p class="sub">Single origins</p><div class="cards">' +
        C.origins.map(function (o, i) {
          return '<article class="card"' + d(i) + '>' + photo(I.origins[i], 700) + '<span class="stamp">Alt.<br>' + o.altitude + '</span>' +
            '<h3>' + o.name + '</h3><p class="notes">' + o.notes.join(' • ') + '</p>' +
            '<p class="meta">' + o.region + '<br>' + o.producer + '</p><span class="postmark">' + o.process + '</span><span class="price">' + money(o.price) + '</span></article>';
        }).join('') + '</div></div>';

      $('gallery').innerHTML = '<div class="wrap"><h2' + d(0) + '>Snapshots</h2><p class="sub">Life at the café</p><div class="strip">' +
        I.gallery.map(function (g, i) { return photo(g, 600, '', d(i % 3)); }).join('') + '</div></div>';

      $('visit').innerHTML = '<div class="wrap"><h2' + d(0) + '>Come On In</h2><p class="sub">We\'d love to see you</p><div class="visit-grid">' +
        '<div class="sign"' + d(1) + '><p class="open">We\'re Open!</p><table><tbody>' + C.hours.map(function (h, i) {
          return '<tr' + (i === today ? ' class="today"' : '') + '><td>' + h.days + '</td><td>' + h.open + '–' + h.close + '</td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<div' + d(2) + '><p class="addr">' + C.address.street + '<br>' + C.address.area + ', ' + C.address.city + '</p><p style="margin-top:.8rem">' + C.phone + ' · ' + C.email + '</p>' + photo(I.visit, 900) + '</div></div></div>';

      $('footer').innerHTML = '<div class="stripes"></div><div class="wrap"><div class="foot"><div><h2>' + C.newsletter.heading + '</h2><p>' + C.newsletter.text + '</p>' +
        '<form class="signup" onsubmit="event.preventDefault()"><input type="email" aria-label="Email address" placeholder="your@email.com" required><button class="btn" type="submit">' + C.newsletter.cta + '</button></form></div>' +
        '<ul class="socials">' + C.socials.map(function (s) { return '<li><a href="' + s.href + '">' + s.label + '</a></li>'; }).join('') + '</ul></div>' +
        '<div class="legal"><span>© ' + new Date().getFullYear() + ' ' + C.name + ' ★ Made with love &amp; caffeine</span><a href="#top">Back to top ↑</a></div></div>';

      window.guardImages(document);
      window.mountSwitcher('retro');

      if (!reduce && 'IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); } }); }, { rootMargin: '0px 0px -8% 0px' });
        document.querySelectorAll('[data-reveal]').forEach(function (el) { io.observe(el); });
      }
    })();
  </script>
