<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halcyon Coffee Roasters — Hand-drawn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap">
  <style>
    :root { --kraft:#efe3cc; --paper:#fffdf6; --pencil:#3b3531; --coffee:#7a5c45; --latte:#c9a27e; --marker:#c0533a;
            --wob: 255px 15px 225px 15px / 15px 225px 15px 255px; --wob2: 15px 225px 15px 255px / 255px 15px 225px 15px; }
    *, *::before, *::after { box-sizing: border-box; }
    /* mobile hardening */
    html { -webkit-text-size-adjust: 100%; }
    body { overflow-wrap: break-word; }
    .switcher__panel { max-height: calc(100vh - 6rem); overflow-y: auto; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--pencil); font-family: 'Patrick Hand', cursive; font-size: 1.2rem; line-height: 1.55;
           background-color: var(--kraft);
           background-image: radial-gradient(circle at 20% 30%, rgb(122 92 69 / .08) 0 2px, transparent 3px), radial-gradient(circle at 70% 80%, rgb(122 92 69 / .07) 0 1.5px, transparent 2.5px);
           background-size: 37px 41px, 53px 47px; }
    button, input { font: inherit; color: inherit; }
    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3, p { margin: 0; }
    .hand, h1, h2, h3 { font-family: 'Caveat', cursive; font-weight: 700; line-height: 1; }
    :focus-visible { outline: 2px dashed var(--marker); outline-offset: 4px; border-radius: 8px; }
    .wrap { max-width: 1160px; margin: 0 auto; padding: 0 clamp(1rem, 4vw, 2rem); }
    .section { padding: clamp(4rem, 8vw, 6.5rem) 0; }
    h2 { font-size: clamp(3rem, 7vw, 4.8rem); color: var(--pencil); display: inline-block; transform: rotate(-1.5deg); position: relative; margin-bottom: 2.5rem; }
    h2 svg { position: absolute; left: -4%; bottom: -14px; width: 108%; height: 22px; overflow: visible; }
    .scribble path, .draw path { fill: none; stroke: var(--marker); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    html.motion .draw path { stroke-dasharray: var(--len, 600); stroke-dashoffset: var(--len, 600); transition: stroke-dashoffset 1.3s ease-in-out .2s; }
    html.motion .is-in .draw path, html.motion .draw.is-in path { stroke-dashoffset: 0; }
    .sketch { position: relative; background: var(--paper); border-radius: var(--wob); }
    .sketch::before { content: ""; position: absolute; inset: -3px; border: 2.5px solid var(--pencil); border-radius: var(--wob2); pointer-events: none; filter: url(#rough); }
    .hl { background: linear-gradient(104deg, transparent .5em, rgb(201 162 126 / .7) .6em, rgb(201 162 126 / .55) 94%, transparent 96%); padding: 0 .25em; }
    .btn { display: inline-block; position: relative; padding: .55rem 1.5rem; font-family: 'Caveat', cursive; font-weight: 700; font-size: 1.6rem; background: var(--latte); border-radius: var(--wob); transition: transform .25s; }
    .btn::before { content: ""; position: absolute; inset: -3px; border: 2.5px solid var(--pencil); border-radius: var(--wob2); filter: url(#rough); }
    .btn:hover { transform: rotate(-2deg) scale(1.04); }
    .btn--paper { background: var(--paper); }

    /* polaroid + tape */
    .pola { background: var(--paper); padding: .7rem .7rem 2.8rem; box-shadow: 0 6px 16px rgb(59 53 49 / .22); position: relative; transition: transform .35s; }
    .pola .ph { aspect-ratio: 1; overflow: hidden; background: var(--latte); }
    .pola .ph img { width: 100%; height: 100%; object-fit: cover; }
    .pola .cap { position: absolute; left: 0; right: 0; bottom: .45rem; text-align: center; font-family: 'Caveat', cursive; font-weight: 500; font-size: 1.4rem; }
    .pola::after { content: ""; position: absolute; top: -14px; left: 50%; width: 96px; height: 28px; transform: translateX(-50%) rotate(-4deg); background: rgb(255 253 246 / .6); box-shadow: 0 1px 2px rgb(59 53 49 / .15); }
    .pola:hover { transform: rotate(0deg) scale(1.03) !important; }
    html.motion .pola:hover { animation: wiggle .5s ease-in-out; }
    @keyframes wiggle { 25% { rotate: 2deg; } 75% { rotate: -2deg; } }

    /* nav */
    .site-nav { padding: 1rem 0; }
    .site-nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .logo { font-family: 'Caveat', cursive; font-weight: 700; font-size: 2.3rem; display: flex; align-items: center; gap: .5rem; }
    .logo svg { width: 38px; height: 38px; }
    .nav-links { display: flex; gap: 1.75rem; list-style: none; margin: 0; padding: 0; font-size: 1.3rem; }
    .nav-links a { position: relative; }
    .nav-links a::after { content: ""; position: absolute; left: -4px; right: -4px; bottom: -2px; height: 8px; border-bottom: 3px solid var(--marker); border-radius: 0 0 50% 50%; transform: scaleX(0); transition: transform .3s; transform-origin: left; }
    .nav-links a:hover::after { transform: scaleX(1); }
    .site-nav .btn { font-size: 1.35rem; padding: .3rem 1.1rem; }

    /* hero */
    #hero { padding: clamp(2rem, 5vw, 4rem) 0 clamp(4rem, 8vw, 6rem); }
    .hero-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: clamp(2rem, 5vw, 4rem); align-items: center; }
    .hero-title { font-size: clamp(3.6rem, 9vw, 7.2rem); line-height: .9; transform: rotate(-2deg); overflow-wrap: break-word; }
    .hero-title span { color: var(--coffee); }
    .note { margin: 1.75rem 0 2rem; font-size: 1.35rem; max-width: 30ch; }
    .hero-ctas { display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: center; position: relative; }
    .arrow { position: absolute; left: 12rem; top: -4.6rem; width: 130px; height: 80px; }
    .arrow-label { position: absolute; left: 20.5rem; top: -5.6rem; font-family: 'Caveat', cursive; font-size: 1.5rem; color: var(--marker); transform: rotate(-6deg); white-space: nowrap; }
    .hero-art { position: relative; }
    .hero-art .pola { transform: rotate(3deg); max-width: 460px; margin-left: auto; }
    .hero-art .pola .ph { aspect-ratio: 4 / 5; }
    .doodle { position: absolute; width: 90px; height: 90px; }
    .doodle path, .doodle circle { fill: none; stroke: var(--pencil); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    html.motion .bob { animation: bob 3s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-5px) rotate(-3deg); } }

    /* about */
    .notebook { padding: clamp(1.5rem, 4vw, 3rem) clamp(1.5rem, 4vw, 3rem) clamp(1.5rem, 4vw, 3rem) clamp(3rem, 7vw, 5rem); background-image: linear-gradient(90deg, transparent 2.4rem, rgb(192 83 58 / .45) 2.4rem, rgb(192 83 58 / .45) calc(2.4rem + 2px), transparent calc(2.4rem + 2px)), repeating-linear-gradient(transparent 0 calc(1.86rem - 1px), rgb(122 92 69 / .25) calc(1.86rem - 1px) 1.86rem); line-height: 1.86rem; }
    .about-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: clamp(2rem, 5vw, 3.5rem); align-items: start; }
    .notebook p + p { margin-top: 1.86rem; }
    .facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem 1rem; margin-top: 2rem; }
    .fact { text-align: center; position: relative; padding: 1rem .25rem; }
    .fact svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .fact b { font-family: 'Caveat', cursive; font-weight: 700; font-size: 2.6rem; display: block; line-height: 1; color: var(--marker); }
    .fact span { font-size: 1rem; }
    .about-side .pola { transform: rotate(-3deg); }

    /* menu */
    .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; }
    .menu-card { padding: 1.75rem 1.5rem 1.5rem; }
    .menu-card:nth-child(2) { transform: rotate(1deg); } .menu-card:nth-child(3) { transform: rotate(-1deg); }
    .menu-card h3 { font-size: 2.3rem; display: flex; align-items: center; gap: .5rem; margin-bottom: .5rem; }
    .menu-card h3 svg { width: 44px; height: 44px; flex: none; }
    .menu-card h3 svg path, .menu-card h3 svg circle { fill: none; stroke: var(--coffee); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .row { display: flex; align-items: baseline; gap: .4rem; margin-top: .9rem; }
    .row strong { font-weight: 400; font-size: 1.3rem; overflow-wrap: anywhere; }
    .row .dots { flex: 1; border-bottom: 2px dotted var(--latte); transform: translateY(-5px); min-width: .75rem; }
    .row .p { font-family: 'Caveat', cursive; font-weight: 700; font-size: 1.5rem; color: var(--marker); position: relative; padding: 0 .35rem; }
    .row .p::before { content: ""; position: absolute; inset: -2px -4px; border: 2px solid var(--marker); border-radius: 50% 45% 55% 48% / 55% 50% 48% 45%; transform: rotate(-4deg); }
    .desc { font-size: 1rem; color: var(--coffee); line-height: 1.35; }

    /* origins index cards */
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.5rem 2rem; }
    .index { background: var(--paper); padding: 2.2rem 1.4rem 1.4rem; box-shadow: 0 5px 14px rgb(59 53 49 / .18); position: relative;
             background-image: linear-gradient(var(--paper) 2.6rem, transparent 2.6rem), repeating-linear-gradient(transparent 0 calc(1.7rem - 1px), rgb(122 92 69 / .2) calc(1.7rem - 1px) 1.7rem); transition: transform .3s; }
    .index:nth-child(1) { transform: rotate(-2deg); } .index:nth-child(2) { transform: rotate(1.5deg); } .index:nth-child(3) { transform: rotate(-1deg); }
    .index:hover { transform: rotate(0) translateY(-4px); }
    .pin { position: absolute; top: -12px; left: 50%; width: 26px; height: 26px; border-radius: 50%; background: var(--marker); transform: translateX(-50%); box-shadow: inset -4px -4px 0 rgb(59 53 49 / .25), 0 3px 4px rgb(59 53 49 / .3); }
    .index .ph { aspect-ratio: 3 / 2; overflow: hidden; border: 2px solid var(--pencil); border-radius: var(--wob); margin-bottom: 1rem; }
    .index .ph img { width: 100%; height: 100%; object-fit: cover; }
    .index h3 { font-size: 2.2rem; }
    .index .notes { margin: .4rem 0 .6rem; line-height: 1.8; }
    .index .meta { font-size: 1rem; color: var(--coffee); line-height: 1.7; }
    .index .price { font-family: 'Caveat', cursive; font-weight: 700; font-size: 1.7rem; color: var(--marker); margin-top: .4rem; }

    /* gallery */
    .scatter { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3rem 2.5rem; padding-top: 1rem; }
    .scatter .pola:nth-child(1) { transform: rotate(-4deg); } .scatter .pola:nth-child(2) { transform: rotate(3deg) translateY(1.5rem); }
    .scatter .pola:nth-child(3) { transform: rotate(-2deg); } .scatter .pola:nth-child(4) { transform: rotate(2.5deg); }
    .scatter .pola:nth-child(5) { transform: rotate(-3deg) translateY(1rem); } .scatter .pola:nth-child(6) { transform: rotate(4deg); }

    /* visit */
    .visit-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 2.5rem; align-items: center; }
    .map { padding: 1rem; }
    .map svg { width: 100%; height: auto; display: block; }
    .map .st { fill: none; stroke: var(--pencil); stroke-width: 3; stroke-linecap: round; }
    .map .blk { fill: var(--latte); fill-opacity: .35; stroke: var(--pencil); stroke-width: 2; }
    .map text { font-family: 'Caveat', cursive; font-size: 20px; fill: var(--pencil); }
    .sticky { background: var(--latte); padding: 1.75rem 1.5rem; transform: rotate(2deg); box-shadow: 0 8px 14px rgb(59 53 49 / .22); position: relative; }
    .sticky::before { content: ""; position: absolute; top: -12px; left: 50%; width: 90px; height: 26px; transform: translateX(-50%) rotate(3deg); background: rgb(255 253 246 / .6); }
    .sticky h3 { font-size: 2.2rem; margin-bottom: .4rem; }
    .sticky table { width: 100%; border-collapse: collapse; }
    .sticky td { padding: .35rem 0; border-bottom: 2px dashed rgb(59 53 49 / .3); }
    .sticky td:last-child { text-align: right; }
    .sticky .today td { color: var(--marker); }
    .sticky .today td:first-child::after { content: " ← today!"; font-family: 'Caveat', cursive; font-size: 1.3rem; }
    .addr { margin-top: 1.25rem; line-height: 1.4; }

    /* footer */
    footer { padding: clamp(3.5rem, 7vw, 5rem) 0 2rem; position: relative; }
    footer::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 12px; background: repeating-linear-gradient(90deg, var(--pencil) 0 18px, transparent 18px 28px); opacity: .6; filter: url(#rough); }
    .foot { display: grid; grid-template-columns: 1.3fr 1fr; gap: 2.5rem; align-items: end; }
    .foot h2 { margin-bottom: .75rem; }
    .signup { display: flex; gap: 1rem; margin-top: 1.25rem; flex-wrap: wrap; align-items: center; }
    .signup .field { flex: 1; min-width: 0; padding: .55rem 1rem; }
    .signup input { width: 100%; border: 0; background: transparent; outline: none; font-size: 1.2rem; position: relative; }
    .socials { list-style: none; margin: 0; padding: 0; display: flex; gap: 1.5rem; justify-content: flex-end; font-family: 'Caveat', cursive; font-size: 1.7rem; font-weight: 700; }
    .socials a:hover { color: var(--marker); }
    .legal { margin-top: 3rem; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; font-size: 1rem; color: var(--coffee); }

    .img-failed { background: var(--latte); min-height: 220px; color: transparent; }

    html.motion [data-reveal] { opacity: 0; translate: 0 18px; transition: opacity .8s ease, translate .9s cubic-bezier(.3,1.4,.5,1); transition-delay: var(--d, 0ms); }
    html.motion [data-reveal].is-in { opacity: 1; translate: 0 0; }

    /* switcher */
    .switcher { position: fixed; right: 1rem; bottom: 1rem; z-index: 60; display: flex; flex-direction: column; align-items: flex-end; gap: .75rem; }
    .switcher__toggle { order: 2; background: var(--latte); border: 0; padding: .6rem 1.1rem; font-family: 'Caveat', cursive; font-weight: 700; font-size: 1.45rem; cursor: pointer; transform: rotate(-3deg); box-shadow: 0 6px 10px rgb(59 53 49 / .25); transition: transform .25s; }
    .switcher__toggle::after { content: " →"; }
    .switcher__toggle:hover { transform: rotate(0) scale(1.05); }
    .switcher__panel { order: 1; display: grid; background: var(--paper); padding: 1rem 1.25rem .75rem 2.25rem; min-width: 220px; box-shadow: 0 8px 18px rgb(59 53 49 / .22);
      background-image: linear-gradient(90deg, transparent 1.4rem, rgb(192 83 58 / .45) 1.4rem, rgb(192 83 58 / .45) calc(1.4rem + 2px), transparent calc(1.4rem + 2px));
      clip-path: polygon(0 4%, 6% 0, 14% 3%, 22% 0, 31% 4%, 40% 1%, 50% 4%, 60% 0, 70% 3%, 80% 0, 90% 4%, 100% 1%, 100% 100%, 0 100%); }
    .switcher__panel[hidden] { display: none; }
    .switcher__link { font-size: 1.25rem; padding: .15rem 0; }
    .switcher__link:hover { color: var(--marker); }
    .switcher__link[aria-current="page"] { color: var(--marker); text-decoration: underline wavy var(--marker); text-underline-offset: 5px; }
    .switcher__link--all { font-family: 'Caveat', cursive; font-weight: 700; font-size: 1.5rem; margin-top: .3rem; }

    @media (max-width: 900px) {
      .hero-grid, .about-grid, .visit-grid, .foot { grid-template-columns: 1fr; }
      .menu-grid, .cards { grid-template-columns: 1fr; }
      .scatter { grid-template-columns: repeat(2, 1fr); gap: 2rem 1.25rem; }
      .scatter .pola { transform: rotate(-1.5deg) !important; } .scatter .pola:nth-child(even) { transform: rotate(1.5deg) !important; }
      .hero-art .pola { margin: 0 auto; }
      .socials { justify-content: flex-start; }
      .arrow, .arrow-label { display: none; }
    }
    @media (max-width: 640px) {
      .nav-links { display: none; }
      .doodle { display: none; }
      .pola .cap { font-size: 1.15rem; }
    }
    /* mobile: nav links become a swipeable row */
    @media (max-width: 640px) {
      .site-nav .wrap { flex-wrap: wrap; height: auto; row-gap: .4rem; padding-top: .6rem; padding-bottom: .6rem; }
      .nav-links { display: flex !important; order: 3; width: 100%; overflow-x: auto; gap: 1.25rem; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
      .nav-links::-webkit-scrollbar { display: none; }
      .nav-links li { flex: none; }
    }
    @media (max-width: 640px) {
      input { font-size: 16px !important; }
      .switcher { right: .75rem; bottom: .75rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter>
  </svg>
  <header class="site-nav" id="top"></header>
  <main>
    <section id="hero"></section>
    <section id="about" class="section"></section>
    <section id="menu" class="section"></section>
    <section id="origins" class="section"></section>
    <section id="gallery" class="section"></section>
    <section id="visit" class="section"></section>
  </main>
  <footer id="footer"></footer>

  <script src="../shared/content.js"></script>
  <script src="../shared/images.js"></script>
  <script src="../shared/switcher.js"></script>
  <script>
    (function () {
      var C = window.CAFE, I = window.IMAGES;
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!reduce) document.documentElement.classList.add('motion');
      function img(e, w, eager) { return '<img src="' + window.imgSrc(e, w) + '" alt="' + e.alt + '" loading="' + (eager ? 'eager' : 'lazy') + '" decoding="async">'; }
      function pola(e, w, cap, attrs, eager) { return '<figure class="pola"' + (attrs || '') + ' style="margin:0"><div class="ph">' + img(e, w, eager) + '</div><figcaption class="cap">' + cap + '</figcaption></figure>'; }
      function money(p) { return C.currency + p; }
      function $(id) { return document.getElementById(id); }
      function d(i) { return ' data-reveal style="--d:' + (i * 120) + 'ms"'; }
      var under = '<svg class="draw" viewBox="0 0 300 22" preserveAspectRatio="none" aria-hidden="true"><path d="M3 14 C 60 4, 120 20, 180 10 S 270 6, 297 12"/></svg>';
      function title(t) { return '<h2' + d(0) + '>' + t + under + '</h2>'; }
      var cup = '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M9 20h26v10a11 11 0 0 1-11 11h-4A11 11 0 0 1 9 30z"/><path d="M35 23h3a5 5 0 0 1 0 10h-4"/><path class="steam" d="M17 15c-2-3 2-5 0-8M24 15c-2-3 2-5 0-8M31 15c-2-3 2-5 0-8"/></svg>';
      var drip = '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M10 10h28l-9 14H19z"/><path d="M24 24v5"/><path d="M14 32h20v7a3 3 0 0 1-3 3H17a3 3 0 0 1-3-3z"/></svg>';
      var crois = '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M6 30c4-12 14-18 18-18s14 6 18 18c-5 2-9 0-11-3-2 4-5 5-7 5s-5-1-7-5c-2 3-6 5-11 3z"/><path d="M18 17l3 12M30 17l-3 12M24 13v16"/></svg>';
      var icons = [cup, drip, crois];
      var today = (function () { var n = new Date().getDay(); return n === 0 ? 2 : n === 6 ? 1 : 0; })();
      var words = C.name.split(' ');

      $('top').innerHTML = '<div class="wrap"><a class="logo" href="#top">' + cup.replace('<svg', '<svg class="doodle-logo"').replace(/<path/g, '<path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"') + C.shortName + '</a>' +
        '<ul class="nav-links">' + C.nav.map(function (n) { return '<li><a href="' + n.href + '">' + n.label + '</a></li>'; }).join('') + '</ul>' +
        '<a class="btn" href="#menu">' + C.cta.order + '</a></div>';

      $('hero').innerHTML = '<div class="wrap hero-grid"><div>' +
        '<h1 class="hero-title"' + d(0) + '>' + words[0] + '<br><span>' + words.slice(1).join(' ') + '</span></h1>' +
        '<p class="note"' + d(1) + '>' + C.tagline + ' <span class="hl">Roasted by hand</span>, a few kilos at a time.</p>' +
        '<div class="hero-ctas"' + d(2) + '><a class="btn" href="#menu">' + C.cta.order + '</a><a class="btn btn--paper" href="#visit">' + C.cta.visit + '</a>' +
        '<svg class="arrow draw" viewBox="0 0 130 80" aria-hidden="true" style="--len:220"><path d="M125 8 C 90 2, 40 10, 22 58 M 10 44 L 22 60 L 36 48"/></svg>' +
        '<span class="arrow-label">try the V60!</span></div></div>' +
        '<div class="hero-art"' + d(1) + '>' + pola(I.hero, 1000, 'the pour-over bar ☼', '', true) +
        '<svg class="doodle bob" viewBox="0 0 90 90" style="left:-10px;top:-30px" aria-hidden="true"><path d="M45 10v14M45 66v14M10 45h14M66 45h14M20 20l10 10M60 60l10 10M20 70l10-10M60 30l10-10"/><circle cx="45" cy="45" r="12"/></svg>' +
        '<svg class="doodle bob" viewBox="0 0 90 90" style="right:-18px;bottom:40px;animation-delay:-1.4s" aria-hidden="true"><path d="M20 55c-8-14 4-30 22-28 6-12 30-10 30 8 12 2 12 20 0 20H20z"/></svg></div></div>';

      var circ = '<svg viewBox="0 0 120 80" preserveAspectRatio="none" class="draw" aria-hidden="true" style="--len:360"><path d="M60 5 C 20 4, 4 24, 8 44 C 12 70, 90 80, 112 50 C 124 30, 100 4, 55 8"/></svg>';
      $('about').innerHTML = '<div class="wrap">' + title('Our little story') + '<div class="about-grid">' +
        '<div class="sketch notebook"' + d(1) + '>' + C.story.map(function (p) { return '<p>' + p + '</p>'; }).join('') + '</div>' +
        '<div class="about-side"' + d(2) + '>' + pola(I.about, 800, 'where the magic happens') +
        '<div class="facts">' + C.facts.map(function (f) { return '<div class="fact" data-reveal>' + circ + '<b>' + f.value + '</b><span>' + f.label + '</span></div>'; }).join('') + '</div></div></div></div>';

      $('menu').innerHTML = '<div class="wrap">' + title('What we\'re pouring') + '<div class="menu-grid">' +
        C.menu.map(function (c, ci) {
          return '<div class="sketch menu-card"' + d(ci) + '><h3>' + icons[ci] + c.category + '</h3>' + c.items.map(function (it) {
            return '<div class="row"><strong>' + it.name + '</strong><span class="dots"></span><span class="p">' + money(it.price) + '</span></div><p class="desc">' + it.desc + '</p>';
          }).join('') + '</div>';
        }).join('') + '</div></div>';

      $('origins').innerHTML = '<div class="wrap">' + title('Beans we love right now') + '<div class="cards">' +
        C.origins.map(function (o, i) {
          return '<article class="index"' + d(i) + '><span class="pin"></span><div class="ph">' + img(I.origins[i], 700) + '</div>' +
            '<h3>' + o.name + '</h3><p class="notes">' + o.notes.map(function (n) { return '<span class="hl">' + n + '</span>'; }).join(' ') + '</p>' +
            '<p class="meta">' + o.region + ' · ' + o.process + '<br>' + o.producer + ' · ' + o.altitude + '</p><p class="price">' + money(o.price) + ' / ' + o.weight + '</p></article>';
        }).join('') + '</div></div>';

      var caps = ['the bar', 'our fig tree', 'rosetta!', 'Friday tasting', 'plant corner', 'lights on'];
      $('gallery').innerHTML = '<div class="wrap">' + title('Snapshots') + '<div class="scatter">' +
        I.gallery.map(function (g, i) { return pola(g, 700, caps[i], d(i % 3)); }).join('') + '</div></div>';

      $('visit').innerHTML = '<div class="wrap">' + title('Come say hi') + '<div class="visit-grid">' +
        '<div class="sketch map"' + d(1) + '><svg class="draw" viewBox="0 0 600 380" role="img" aria-label="Hand-drawn map to ' + C.address.street + '" style="--len:900">' +
          '<rect class="blk" x="30" y="30" width="170" height="110" rx="14"/><rect class="blk" x="250" y="30" width="140" height="110" rx="14"/><rect class="blk" x="430" y="30" width="140" height="110" rx="14"/>' +
          '<rect class="blk" x="30" y="220" width="220" height="130" rx="14"/><rect class="blk" x="300" y="220" width="270" height="130" rx="14"/>' +
          '<path class="st" d="M0 180 C 150 172, 450 188, 600 178" style="stroke-dasharray:none"/><path class="st" d="M222 0 C 226 120, 218 260, 226 380" style="stroke-dasharray:none"/>' +
          '<path d="M40 200 C 120 195, 200 205, 270 196 S 380 150, 420 120"/><path d="M405 95 l 30 30 M 435 95 l -30 30" style="stroke-width:5"/>' +
          '<text x="440" y="90">we\'re here!</text><text x="40" y="170">Larkspur St</text><text x="232" y="330" transform="rotate(-90 232 330)">Elm Ave</text></svg></div>' +
        '<div' + d(2) + '><div class="sticky"><h3>Opening hours</h3><table><tbody>' + C.hours.map(function (h, i) {
          return '<tr' + (i === today ? ' class="today"' : '') + '><td>' + h.days + '</td><td>' + h.open + ' – ' + h.close + '</td></tr>';
        }).join('') + '</tbody></table></div><p class="addr">' + C.address.street + '<br>' + C.address.area + ', ' + C.address.city + '<br>' + C.phone + '<br>' + C.email + '</p>' +
        '<div style="margin-top:1.5rem;max-width:300px">' + pola(I.visit, 600, 'find the chalkboard') + '</div></div></div></div>';

      $('footer').innerHTML = '<div class="wrap"><div class="foot"><div><h2 style="margin-bottom:.5rem">' + C.newsletter.heading + under + '</h2><p>' + C.newsletter.text + '</p>' +
        '<form class="signup" onsubmit="event.preventDefault()"><div class="sketch field"><input type="email" aria-label="Email address" placeholder="your email here..." required></div><button class="btn" type="submit" style="border:0;cursor:pointer">' + C.newsletter.cta + '</button></form></div>' +
        '<ul class="socials">' + C.socials.map(function (s) { return '<li><a href="' + s.href + '">' + s.label + '</a></li>'; }).join('') + '</ul></div>' +
        '<div class="legal"><span>© ' + new Date().getFullYear() + ' ' + C.name + ' — drawn with love</span><a href="#top">back to top ↑</a></div></div>';

      window.guardImages(document);
      window.mountSwitcher('hand-drawn');

      if (!reduce && 'IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); } }); }, { rootMargin: '0px 0px -8% 0px' });
        document.querySelectorAll('[data-reveal], .draw').forEach(function (el) { io.observe(el); });
      }
    })();
  </script>
</body>
</html>
