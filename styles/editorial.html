<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halcyon Coffee Roasters — Editorial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..600&family=Inter:wght@400;500;600&display=swap">
  <style>
    :root { --paper:#f6f1e7; --ink:#1c1917; --coffee:#4a2c1d; --muted:#8a7a6a; --rule:#d9cfbf; --ease: cubic-bezier(.22,.8,.2,1); }
    *, *::before, *::after { box-sizing: border-box; }
    /* mobile hardening */
    html { -webkit-text-size-adjust: 100%; }
    body { overflow-wrap: break-word; }
    .switcher__panel { max-height: calc(100vh - 6rem); overflow-y: auto; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Fraunces', serif; font-optical-sizing: auto; font-weight: 350; font-size: 1.15rem; line-height: 1.65; }
    button, input { font: inherit; color: inherit; }
    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3, p, figure { margin: 0; }
    :focus-visible { outline: 1px solid var(--coffee); outline-offset: 3px; }
    .sans { font-family: 'Inter', sans-serif; font-weight: 500; font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; }
    .wrap { max-width: 1240px; margin: 0 auto; padding: 0 clamp(1.1rem, 4vw, 2.5rem); }
    .section { padding: clamp(4.5rem, 9vw, 8rem) 0; }
    .rule2 { border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); height: 5px; }
    .kicker { color: var(--coffee); }
    h2 { font-weight: 300; font-size: clamp(2.4rem, 6vw, 4.8rem); line-height: 1; letter-spacing: -.02em; }
    h2 em { font-style: italic; color: var(--coffee); }
    .sec-head { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 1rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--ink); margin-bottom: clamp(2.5rem, 5vw, 4rem); }
    .sec-head .sans { text-align: right; line-height: 1.8; }
    a.link { background-image: linear-gradient(var(--coffee), var(--coffee)); background-size: 0 1px; background-repeat: no-repeat; background-position: 0 100%; transition: background-size .5s var(--ease); }
    a.link:hover { background-size: 100% 1px; }
    figcaption { font-family: 'Inter', sans-serif; font-size: .75rem; color: var(--muted); margin-top: .6rem; line-height: 1.5; }
    figcaption b { color: var(--ink); font-weight: 600; margin-right: .4rem; }
    .frame { overflow: hidden; }
    .frame img { width: 100%; height: 100%; object-fit: cover; }
    html.motion .frame img { transform: translateY(var(--py, 0)) scale(1.1); will-change: transform; }

    /* masthead */
    .site-nav { background: var(--paper); }
    .dateline { display: flex; justify-content: space-between; gap: 1rem; padding: .7rem 0; flex-wrap: wrap; }
    .masthead { text-align: center; padding: clamp(1rem, 3vw, 2rem) 0 clamp(.8rem, 2vw, 1.4rem); }
    .masthead a { font-weight: 600; font-size: clamp(2.6rem, 8vw, 6.5rem); letter-spacing: -.035em; line-height: .9; font-variation-settings: 'opsz' 144; }
    .masthead a i { font-weight: 300; color: var(--coffee); }
    .sections { display: flex; justify-content: center; gap: clamp(1rem, 4vw, 3rem); padding: .75rem 0; list-style: none; margin: 0; flex-wrap: wrap; }
    .sections a:hover { color: var(--coffee); }

    /* hero / cover story */
    #hero { padding: clamp(3rem, 6vw, 5rem) 0 clamp(4rem, 8vw, 6rem); }
    .cover { display: grid; grid-template-columns: 1.05fr 1fr; gap: clamp(2rem, 5vw, 5rem); align-items: start; }
    .cover h1 { font-weight: 300; font-style: italic; font-size: clamp(2.8rem, 6.4vw, 5.8rem); line-height: 1.02; letter-spacing: -.025em; margin: 1rem 0 1.75rem; font-variation-settings: 'opsz' 144; overflow-wrap: break-word; }
    .cover h1 b { font-style: normal; font-weight: 600; }
    .standfirst { font-size: 1.35rem; line-height: 1.5; color: var(--coffee); max-width: 32ch; }
    .byline { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--rule); display: flex; gap: 2rem; flex-wrap: wrap; }
    .cover .frame { aspect-ratio: 4 / 5; }
    .read { display: inline-block; margin-top: 2rem; font-style: italic; font-size: 1.2rem; }
    .read::after { content: " →"; font-style: normal; }

    /* line reveal */
    html.motion .line { clip-path: inset(0 0 100% 0); transform: translateY(20px); transition: clip-path 1.1s var(--ease), transform 1.1s var(--ease); transition-delay: var(--d, 0ms); }
    html.motion .is-in .line, html.motion .line.is-in { clip-path: inset(-10% 0 -10% 0); transform: none; }

    /* about / article */
    .article { display: grid; grid-template-columns: 2.2fr 1fr; gap: clamp(2rem, 5vw, 4.5rem); }
    .body-cols { column-count: 2; column-gap: 2.5rem; column-rule: 1px solid var(--rule); }
    .body-cols p { margin-bottom: 1.2rem; text-align: justify; hyphens: auto; }
    .body-cols p:first-child::first-letter { float: left; font-size: 5.4em; line-height: .8; padding: .08em .1em 0 0; font-weight: 600; color: var(--coffee); font-variation-settings: 'opsz' 144; }
    html.motion .body-cols p:first-child::first-letter { transition: opacity 1.4s var(--ease); }
    .pull { column-span: all; margin: 1.5rem 0 2rem; padding: 1.5rem 0; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); font-style: italic; font-weight: 300; font-size: clamp(1.6rem, 3vw, 2.3rem); line-height: 1.2; color: var(--coffee); text-align: center; }
    .aside { border: 1px solid var(--ink); padding: 1.5rem; align-self: start; position: sticky; top: 1.5rem; }
    .aside h3 { font-weight: 600; font-size: 1.3rem; margin: .5rem 0 1rem; }
    .aside dl { margin: 0; }
    .aside div { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: .6rem 0; border-top: 1px solid var(--rule); }
    .aside dt { font-family: 'Inter', sans-serif; font-size: .78rem; color: var(--muted); }
    .aside dd { margin: 0; font-weight: 600; font-size: 1.35rem; font-variant-numeric: oldstyle-nums; }
    .aside figure { margin-top: 1.25rem; }
    .aside .frame { aspect-ratio: 4 / 3; }

    /* menu */
    #menu { background: var(--ink); color: var(--paper); }
    #menu .sec-head { border-color: var(--paper); }
    #menu h2 em { color: var(--rule); }
    .bill { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
    .bill > div { padding: 0 clamp(1rem, 2.5vw, 2rem); border-left: 1px solid rgb(246 241 231 / .25); }
    .bill > div:first-child { padding-left: 0; border-left: 0; }
    .bill h3 { font-family: 'Inter', sans-serif; font-weight: 500; font-size: .72rem; letter-spacing: .2em; text-transform: uppercase; color: var(--rule); margin-bottom: 1.5rem; text-align: center; }
    .bill h3::before, .bill h3::after { content: " ✦ "; color: var(--muted); }
    .dish { margin-bottom: 1.5rem; text-align: center; }
    .dish strong { display: block; font-style: italic; font-weight: 400; font-size: 1.35rem; line-height: 1.2; }
    .dish p { font-size: .95rem; color: var(--rule); margin: .25rem 0; line-height: 1.45; }
    .dish span { font-variant-numeric: oldstyle-nums; font-size: 1.05rem; }

    /* origins feature */
    .feature { display: grid; grid-template-columns: 1fr 1.4fr; gap: clamp(1.5rem, 4vw, 3.5rem); padding: clamp(2rem, 4vw, 3rem) 0; border-top: 1px solid var(--rule); align-items: center; }
    .feature:nth-child(even) { grid-template-columns: 1.4fr 1fr; }
    .feature:nth-child(even) figure { order: 2; }
    .feature .frame { aspect-ratio: 4 / 5; max-height: 520px; }
    .feature h3 { font-weight: 400; font-size: clamp(2rem, 4.5vw, 3.6rem); line-height: 1; letter-spacing: -.02em; margin: .6rem 0 1rem; }
    .feature h3 i { color: var(--coffee); font-weight: 300; }
    .feature .notes { font-style: italic; font-size: 1.3rem; color: var(--coffee); margin-bottom: 1rem; }
    .feature .spec { font-family: 'Inter', sans-serif; font-size: .8rem; color: var(--muted); line-height: 1.8; margin-top: 1rem; }
    .feature .spec b { color: var(--ink); font-weight: 600; }

    /* gallery essay */
    .essay { display: grid; grid-template-columns: repeat(6, 1fr); gap: clamp(1rem, 2.5vw, 2rem); align-items: end; }
    .essay figure:nth-child(1) { grid-column: 1 / 4; } .essay figure:nth-child(1) .frame { aspect-ratio: 4 / 5; }
    .essay figure:nth-child(2) { grid-column: 4 / 7; } .essay figure:nth-child(2) .frame { aspect-ratio: 3 / 2; }
    .essay figure:nth-child(3) { grid-column: 1 / 3; } .essay figure:nth-child(3) .frame { aspect-ratio: 3 / 4; }
    .essay figure:nth-child(4) { grid-column: 3 / 7; } .essay figure:nth-child(4) .frame { aspect-ratio: 16 / 9; }
    .essay figure:nth-child(5) { grid-column: 1 / 5; } .essay figure:nth-child(5) .frame { aspect-ratio: 16 / 10; }
    .essay figure:nth-child(6) { grid-column: 5 / 7; } .essay figure:nth-child(6) .frame { aspect-ratio: 3 / 4; }

    /* visit colophon */
    .colophon { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: clamp(1.5rem, 4vw, 3rem); border-top: 1px solid var(--ink); padding-top: 2rem; }
    .colophon h3 { margin-bottom: .8rem; }
    .colophon address { font-style: normal; font-size: 1.5rem; line-height: 1.35; }
    .colophon table { width: 100%; border-collapse: collapse; }
    .colophon td { padding: .5rem 0; border-bottom: 1px solid var(--rule); font-variant-numeric: oldstyle-nums; }
    .colophon td:last-child { text-align: right; font-style: italic; }
    .colophon .today td:first-child::after { content: " · today"; font-family: 'Inter', sans-serif; font-size: .65rem; letter-spacing: .14em; text-transform: uppercase; color: var(--coffee); }
    .colophon .frame { aspect-ratio: 4 / 3; }

    /* footer */
    footer { border-top: 1px solid var(--ink); padding: clamp(3.5rem, 7vw, 5rem) 0 2rem; }
    .foot { display: grid; grid-template-columns: 1.3fr 1fr; gap: 3rem; align-items: end; }
    .foot h2 { font-size: clamp(2.2rem, 5vw, 3.8rem); }
    .foot p { color: var(--muted); margin: .75rem 0 1.5rem; }
    .signup { display: flex; border: 1px solid var(--ink); max-width: 480px; }
    .signup input { flex: 1; min-width: 0; border: 0; background: transparent; padding: .8rem 1rem; outline: none; }
    .signup button { border: 0; border-left: 1px solid var(--ink); background: var(--ink); color: var(--paper); padding: 0 1.25rem; cursor: pointer; font-family: 'Inter', sans-serif; font-size: .72rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
    .signup button:hover { background: var(--coffee); }
    .socials { list-style: none; margin: 0; padding: 0; display: flex; gap: 1.5rem; justify-content: flex-end; font-style: italic; }
    .folio { margin-top: 3.5rem; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; color: var(--muted); }

    .img-failed { background: var(--rule); min-height: 320px; color: transparent; }

    html.motion [data-reveal] { opacity: 0; transform: translateY(24px); transition: opacity 1.1s var(--ease), transform 1.1s var(--ease); transition-delay: var(--d, 0ms); }
    html.motion [data-reveal].is-in { opacity: 1; transform: none; }

    /* switcher */
    .switcher { position: fixed; right: 1rem; bottom: 1rem; z-index: 60; display: flex; flex-direction: column; align-items: flex-end; gap: .5rem; }
    .switcher__toggle { order: 2; background: var(--paper); border: 1px solid var(--ink); padding: .6rem 1rem; cursor: pointer; font-family: 'Inter', sans-serif; font-size: .7rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
    .switcher__toggle::after { content: " ↗"; }
    .switcher__toggle:hover { background: var(--ink); color: var(--paper); }
    .switcher__panel { order: 1; display: grid; background: var(--paper); border: 1px solid var(--ink); padding: .4rem 1.1rem; min-width: 220px; }
    .switcher__panel[hidden] { display: none; }
    .switcher__link { font-style: italic; font-size: 1.1rem; padding: .4rem 0; border-bottom: 1px solid var(--rule); }
    .switcher__link:hover { color: var(--coffee); }
    .switcher__link[aria-current="page"] { font-weight: 600; font-style: normal; }
    .switcher__link[aria-current="page"]::after { content: " — reading"; font-family: 'Inter', sans-serif; font-size: .62rem; letter-spacing: .14em; text-transform: uppercase; color: var(--coffee); font-style: normal; font-weight: 500; }
    .switcher__link--all { border-bottom: 0; font-style: normal; font-family: 'Inter', sans-serif; font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; }

    @media (max-width: 900px) {
      .cover, .article, .foot, .colophon { grid-template-columns: 1fr; }
      .body-cols { column-count: 1; }
      .aside { position: static; }
      .bill { grid-template-columns: 1fr; gap: 2rem; }
      .bill > div { border-left: 0; padding: 0; }
      .feature, .feature:nth-child(even) { grid-template-columns: 1fr; }
      .feature:nth-child(even) figure { order: 0; }
      .essay { grid-template-columns: 1fr 1fr; }
      .essay figure { grid-column: span 1 !important; }
      .essay figure:nth-child(1), .essay figure:nth-child(4) { grid-column: 1 / -1 !important; }
      .socials { justify-content: flex-start; }
    }
    @media (max-width: 640px) {
      .dateline span:nth-child(2) { display: none; }
      .body-cols p { text-align: left; }
    }
    @media (max-width: 640px) { .sections { gap: .9rem 1.4rem; } .sec-head { grid-template-columns: 1fr; } .sec-head .sans { text-align: left; } }
    @media (max-width: 640px) {
      input { font-size: 16px !important; }
      .switcher { right: .75rem; bottom: .75rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="site-nav" id="top"></header>
  <main>
    <section id="hero"></section>
    <section id="about" class="section"></section>
    <section id="menu" class="section"></section>
    <section id="origins" class="section"></section>
    <section id="gallery" class="section"></section>
    <section id="visit" class="section"></section>
  </main>
  <footer id="footer"></footer>

  <script src="../shared/content.js"></script>
  <script src="../shared/images.js"></script>
  <script src="../shared/switcher.js"></script>
  <script>
    (function () {
      var C = window.CAFE, I = window.IMAGES;
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!reduce) document.documentElement.classList.add('motion');
      function img(e, w, eager) { return '<img src="' + window.imgSrc(e, w) + '" alt="' + e.alt + '" loading="' + (eager ? 'eager' : 'lazy') + '" decoding="async">'; }
      function fig(e, w, n, eager) { return '<figure><div class="frame" data-parallax>' + img(e, w, eager) + '</div><figcaption><b>' + n + '</b>' + e.alt + '.</figcaption></figure>'; }
      function money(p) { return C.currency + p; }
      function $(id) { return document.getElementById(id); }
      function d(i) { return ' data-reveal style="--d:' + (i * 120) + 'ms"'; }
      function head(title, kicker, page) { return '<div class="sec-head"' + d(0) + '><h2>' + title + '</h2><p class="sans">' + kicker + '<br>p. ' + page + '</p></div>'; }
      var today = (function () { var n = new Date().getDay(); return n === 0 ? 2 : n === 6 ? 1 : 0; })();
      var year = new Date().getFullYear();
      var words = C.name.split(' ');

      $('top').innerHTML = '<div class="wrap"><div class="dateline sans"><span>Issue No. 07</span><span>The coffee journal of ' + C.address.area + '</span><span>Autumn ' + year + '</span></div>' +
        '<div class="rule2"></div><div class="masthead"><a href="#top">' + words[0] + ' <i>' + words.slice(1).join(' ') + '</i></a></div>' +
        '<div class="rule2"></div><ul class="sections sans">' + C.nav.map(function (n) { return '<li><a href="' + n.href + '">' + n.label + '</a></li>'; }).join('') +
        '<li><a href="#menu" style="color:var(--coffee)">' + C.cta.order + '</a></li></ul><div class="rule2" style="height:1px;border-bottom:0"></div></div>';

      $('hero').innerHTML = '<div class="wrap cover"><div class="is-in"><p class="sans kicker line">Cover story — The Roastery</p>' +
        '<h1><span class="line" style="display:block;--d:100ms">Small-batch coffee</span><span class="line" style="display:block;--d:220ms">from people we</span><span class="line" style="display:block;--d:340ms"><b>know by name.</b></span></h1>' +
        '<p class="standfirst line" style="--d:460ms">' + C.intro + '</p>' +
        '<div class="byline sans line" style="--d:560ms"><span>Words by the ' + C.shortName + ' team</span><span>Photographs by Unsplash</span><span>6 min read</span></div>' +
        '<a class="read link line" style="--d:640ms" href="#about">Read the story</a></div>' +
        '<div' + d(2) + '>' + fig(I.hero, 1100, 'Fig. 1', true) + '</div></div>';

      $('about').innerHTML = '<div class="wrap">' + head('Our <em>story</em>', 'Features', 4) + '<div class="article">' +
        '<div class="body-cols"' + d(1) + '><p>' + C.story[0] + '</p><p>' + C.story[1] + '</p><blockquote class="pull">“There are no syrups to hide behind — just seasonal coffee and good milk.”</blockquote><p>' + C.story[2] + '</p></div>' +
        '<aside class="aside"' + d(2) + '><p class="sans kicker">At a glance</p><h3>The roastery in numbers</h3><dl>' +
        C.facts.map(function (f) { return '<div><dt>' + f.label + '</dt><dd>' + f.value + '</dd></div>'; }).join('') + '</dl>' + fig(I.about, 700, 'Fig. 2') + '</aside></div></div>';

      $('menu').innerHTML = '<div class="wrap">' + head('The bill <em>of fare</em>', 'Served daily', 8) + '<div class="bill">' +
        C.menu.map(function (c, ci) {
          return '<div' + d(ci) + '><h3>' + c.category + '</h3>' + c.items.map(function (it) {
            return '<div class="dish"><strong>' + it.name + '</strong><p>' + it.desc + '</p><span>' + money(it.price) + '</span></div>';
          }).join('') + '</div>';
        }).join('') + '</div></div>';

      $('origins').innerHTML = '<div class="wrap">' + head('Three <em>origins</em>', 'Currently roasting', 10) +
        C.origins.map(function (o, i) {
          var parts = o.name.split(' ');
          return '<article class="feature"' + d(0) + '>' + fig(I.origins[i], 800, 'Fig. ' + (i + 3)) +
            '<div><p class="sans kicker">Origin 0' + (i + 1) + ' — ' + o.process + '</p><h3>' + parts[0] + ' <i>' + parts.slice(1).join(' ') + '</i></h3>' +
            '<p class="notes">' + o.notes.join(', ') + '.</p><p>Grown at ' + o.altitude + ' by the ' + o.producer + ' in ' + o.region + ', this is a coffee that tastes exactly of where it came from.</p>' +
            '<p class="spec"><b>Region</b> ' + o.region + ' &nbsp;·&nbsp; <b>Producer</b> ' + o.producer + ' &nbsp;·&nbsp; <b>Altitude</b> ' + o.altitude + ' &nbsp;·&nbsp; <b>' + money(o.price) + '</b> / ' + o.weight + '</p></div></article>';
        }).join('') + '</div>';

      $('gallery').innerHTML = '<div class="wrap">' + head('A day <em>at the bar</em>', 'Photo essay', 14) + '<div class="essay">' +
        I.gallery.map(function (g, i) { return '<div style="display:contents">' + fig(g, 1000, 'Pl. ' + ['I', 'II', 'III', 'IV', 'V', 'VI'][i]) + '</div>'; }).join('') + '</div></div>';

      $('visit').innerHTML = '<div class="wrap">' + head('Visit <em>us</em>', 'Colophon', 18) + '<div class="colophon">' +
        '<div' + d(0) + '><h3 class="sans kicker">Address</h3><address>' + C.address.street + '<br>' + C.address.area + '<br>' + C.address.city + '</address>' +
        '<p class="sans" style="margin-top:1.25rem;line-height:2">' + C.phone + '<br>' + C.email + '</p></div>' +
        '<div' + d(1) + '><h3 class="sans kicker">Opening hours</h3><table><tbody>' + C.hours.map(function (h, i) {
          return '<tr' + (i === today ? ' class="today"' : '') + '><td>' + h.days + '</td><td>' + h.open + ' – ' + h.close + '</td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<div' + d(2) + '>' + fig(I.visit, 800, 'Fig. 9') + '</div></div></div>';

      $('footer').innerHTML = '<div class="wrap"><div class="foot"><div><p class="sans kicker">Subscribe to the journal</p><h2>' + C.newsletter.heading + '</h2><p>' + C.newsletter.text + '</p>' +
        '<form class="signup" onsubmit="event.preventDefault()"><input type="email" aria-label="Email address" placeholder="Your email address" required><button type="submit">' + C.newsletter.cta + '</button></form></div>' +
        '<ul class="socials">' + C.socials.map(function (s) { return '<li><a class="link" href="' + s.href + '">' + s.label + '</a></li>'; }).join('') + '</ul></div>' +
        '<div class="folio sans"><span>© ' + year + ' ' + C.name + '</span><span>p. 20</span><a href="#top">Back to cover ↑</a></div></div>';

      // essay figures are wrapped in display:contents; move the reveal onto the figure
      document.querySelectorAll('.essay > div').forEach(function (w, i) { var f = w.firstChild; f.setAttribute('data-reveal', ''); f.style.setProperty('--d', (i % 2 * 120) + 'ms'); });

      window.guardImages(document);
      window.mountSwitcher('editorial');

      if (!reduce && 'IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); } }); }, { rootMargin: '0px 0px -8% 0px' });
        document.querySelectorAll('[data-reveal]').forEach(function (el) { io.observe(el); });
        var frames = [].slice.call(document.querySelectorAll('[data-parallax]')), ticking = false;
        function para() {
          var vh = innerHeight;
          frames.forEach(function (f) {
            var r = f.getBoundingClientRect(); if (r.bottom < 0 || r.top > vh) return;
            var p = (r.top + r.height / 2 - vh / 2) / vh;
            f.style.setProperty('--py', (p * -8).toFixed(2) + '%');
          });
          ticking = false;
        }
        addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(para); } }, { passive: true });
        para();
      }
    })();
  </script>
</body>
</html>
