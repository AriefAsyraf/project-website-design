<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halcyon Coffee Roasters — Swiss Style</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;800&display=swap">
  <style>
    :root { --white:#ffffff; --black:#111111; --red:#e30613; --g1:#f2f2f2; --g2:#767676; --gutter: 24px; --ease: cubic-bezier(.7,0,.3,1); }
    *, *::before, *::after { box-sizing: border-box; }
    /* mobile hardening */
    html { -webkit-text-size-adjust: 100%; }
    body { overflow-wrap: break-word; }
    .switcher__panel { max-height: calc(100vh - 6rem); overflow-y: auto; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--white); color: var(--black); font-family: 'Inter Tight', sans-serif; font-size: 1.05rem; line-height: 1.45; }
    button, input { font: inherit; color: inherit; }
    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3, p { margin: 0; }
    :focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
    .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gutter); max-width: 1440px; margin: 0 auto; padding: 0 clamp(16px, 3vw, 40px); }
    .section { padding: clamp(4rem, 8vw, 7rem) 0; }
    .top { grid-column: 1 / -1; display: flex; gap: 1rem; align-items: baseline; padding-top: 1rem; position: relative; margin-bottom: clamp(2.5rem, 6vw, 5rem); }
    .top::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--black); transform-origin: left; }
    html.motion .top::before { transform: scaleX(0); transition: transform .9s var(--ease); }
    html.motion .top.is-in::before { transform: scaleX(1); }
    .top .n { color: var(--red); font-weight: 500; }
    .top h2 { font-weight: 800; font-size: clamp(2.2rem, 5.5vw, 4.5rem); letter-spacing: -.045em; line-height: .95; }
    .small { font-size: .82rem; font-weight: 500; }
    .muted { color: var(--g2); }

    /* nav */
    .site-nav { position: sticky; top: 0; z-index: 30; background: var(--white); border-bottom: 2px solid var(--black); }
    .site-nav .grid { align-items: center; height: 60px; }
    .brand { grid-column: 1 / 4; font-weight: 800; letter-spacing: -.03em; font-size: 1.15rem; display: flex; align-items: center; gap: .55rem; }
    .brand::before { content: ""; width: 14px; height: 14px; background: var(--red); }
    .nav-links { grid-column: 4 / 10; display: flex; gap: var(--gutter); list-style: none; margin: 0; padding: 0; font-weight: 500; font-size: .95rem; }
    .nav-links a:hover { color: var(--red); }
    .nav-links .i { color: var(--g2); margin-right: .3rem; font-size: .8rem; }
    .order { grid-column: 10 / 13; justify-self: end; font-weight: 700; font-size: .95rem; }
    .order::after { content: " →"; color: var(--red); }

    /* hero */
    #hero { padding: clamp(3rem, 6vw, 5rem) 0 clamp(4rem, 8vw, 7rem); }
    .hero-meta { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gutter); margin-bottom: clamp(2rem, 5vw, 4rem); }
    .hero-meta span { grid-column: span 3; font-size: .82rem; font-weight: 500; border-top: 1px solid var(--black); padding-top: .5rem; }
    .hero-title { grid-column: 1 / 11; font-weight: 800; font-size: clamp(3.2rem, 11vw, 10rem); letter-spacing: -.055em; line-height: .86; overflow-wrap: break-word; position: relative; z-index: 2; }
    .hero-title .w { display: block; }
    .hero-title .w:last-child { color: var(--red); }
    .hero-block { grid-column: 1 / 3; grid-row: 3; background: var(--red); aspect-ratio: 1; margin-top: clamp(2rem, 4vw, 3rem); }
    .hero-copy { grid-column: 3 / 7; grid-row: 3; margin-top: clamp(2rem, 4vw, 3rem); font-size: 1.25rem; font-weight: 500; line-height: 1.3; letter-spacing: -.01em; }
    .hero-copy a { display: inline-block; margin-top: 1.5rem; font-weight: 700; border-bottom: 2px solid var(--red); }
    .hero-photo { grid-column: 7 / 13; grid-row: 2 / 4; margin-top: clamp(6rem, 12vw, 10rem); aspect-ratio: 4 / 5; overflow: hidden; }
    .hero-photo img { width: 100%; height: 100%; object-fit: cover; }

    /* about */
    .about-photo { grid-column: 1 / 5; aspect-ratio: 3 / 4; overflow: hidden; }
    .about-photo img { width: 100%; height: 100%; object-fit: cover; }
    .story { grid-column: 6 / 12; }
    .story p { margin-bottom: 1.2rem; }
    .story p:first-child { font-size: clamp(1.4rem, 2.6vw, 2rem); font-weight: 700; letter-spacing: -.025em; line-height: 1.15; }
    .facts { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gutter); margin-top: clamp(3rem, 6vw, 5rem); }
    .fact { border-top: 2px solid var(--black); padding-top: .75rem; }
    .fact b { display: block; font-weight: 800; font-size: clamp(2.8rem, 6vw, 5rem); letter-spacing: -.05em; line-height: 1; }
    .fact:first-child b { color: var(--red); }

    /* menu */
    #menu { background: var(--g1); }
    .menu-block { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--gutter); border-top: 2px solid var(--black); padding: 1.25rem 0 2.5rem; }
    .menu-block h3 { grid-column: 1 / 4; font-weight: 800; font-size: 1.5rem; letter-spacing: -.03em; }
    .menu-block h3 span { display: block; color: var(--red); font-size: .82rem; font-weight: 500; letter-spacing: 0; margin-bottom: .2rem; }
    .items { grid-column: 4 / 13; }
    .item { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); column-gap: var(--gutter); padding: .75rem 0; border-bottom: 1px solid var(--g2); }
    .item:first-child { padding-top: 0; }
    .item strong { grid-column: 1 / 4; font-weight: 700; overflow-wrap: break-word; }
    .item p { grid-column: 4 / 8; color: var(--g2); }
    .item .price { grid-column: 8 / 10; text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }

    /* origins */
    .origin { grid-column: span 4; }
    .origin .ph { aspect-ratio: 1; overflow: hidden; margin-bottom: 1rem; }
    .origin .ph img { width: 100%; height: 100%; object-fit: cover; }
    .origin .k { color: var(--red); font-size: .82rem; font-weight: 500; }
    .origin h3 { font-weight: 800; font-size: 1.8rem; letter-spacing: -.035em; margin: .2rem 0 .6rem; }
    .origin .notes { font-weight: 500; margin-bottom: 1rem; }
    .origin dl { margin: 0; display: grid; grid-template-columns: 1fr 2fr; font-size: .88rem; border-top: 1px solid var(--black); }
    .origin dt, .origin dd { margin: 0; padding: .45rem 0; border-bottom: 1px solid var(--g1); }
    .origin dt { color: var(--g2); }
    .origin .buy { display: flex; justify-content: space-between; padding-top: .8rem; font-weight: 700; }

    /* gallery */
    .gallery .ph { overflow: hidden; margin-bottom: var(--gutter); }
    .gallery img { width: 100%; height: 100%; object-fit: cover; }
    .gallery .p1 { grid-column: 1 / 7; aspect-ratio: 3 / 2; }
    .gallery .p2 { grid-column: 7 / 10; aspect-ratio: 3 / 4; }
    .gallery .p3 { grid-column: 10 / 13; aspect-ratio: 3 / 4; }
    .gallery .p4 { grid-column: 1 / 4; aspect-ratio: 1; }
    .gallery .p5 { grid-column: 4 / 10; aspect-ratio: 2 / 1; }
    .gallery .p6 { grid-column: 10 / 13; aspect-ratio: 1; }
    .gallery .cap { display: block; margin-top: .4rem; font-size: .78rem; color: var(--g2); }
    .gallery figure { margin: 0; }

    /* visit */
    .addr { grid-column: 1 / 7; font-weight: 800; font-size: clamp(2rem, 4.6vw, 3.8rem); letter-spacing: -.045em; line-height: .98; }
    .contact { grid-column: 1 / 7; margin-top: 1.5rem; font-weight: 500; display: grid; gap: .2rem; }
    .hours { grid-column: 7 / 13; grid-row: 2 / 4; align-self: start; width: 100%; border-collapse: collapse; }
    .hours td { padding: .85rem 0; border-top: 1px solid var(--black); font-weight: 500; font-variant-numeric: tabular-nums; }
    .hours tr:last-child td { border-bottom: 1px solid var(--black); }
    .hours td:last-child { text-align: right; }
    .hours .today td { color: var(--red); font-weight: 700; }
    .visit-photo { grid-column: 1 / 7; margin-top: 2rem; aspect-ratio: 16 / 9; overflow: hidden; }
    .visit-photo img { width: 100%; height: 100%; object-fit: cover; }
    .top + .addr { grid-row: 2; }

    /* footer */
    footer { background: var(--black); color: var(--white); padding: clamp(3.5rem, 7vw, 5.5rem) 0 2rem; }
    .f1 { grid-column: 1 / 7; }
    .f1 h2 { font-weight: 800; font-size: clamp(2.2rem, 5vw, 4rem); letter-spacing: -.045em; line-height: .95; }
    .f1 p { margin: 1rem 0 1.5rem; color: var(--g1); }
    .signup { display: grid; grid-template-columns: 1fr auto; border-bottom: 2px solid var(--white); max-width: 480px; }
    .signup input { background: transparent; border: 0; padding: .75rem 0; color: var(--white); min-width: 0; outline: none; }
    .signup input::placeholder { color: var(--g2); }
    .signup button { background: none; border: 0; color: var(--white); font-weight: 700; cursor: pointer; }
    .signup button::after { content: " →"; color: var(--red); }
    .f2 { grid-column: 9 / 13; list-style: none; margin: 0; padding: 0; align-self: end; }
    .f2 li { border-top: 1px solid var(--g2); padding: .6rem 0; display: flex; justify-content: space-between; }
    .f2 a:hover { color: var(--red); }
    .legal { grid-column: 1 / -1; margin-top: 4rem; display: flex; justify-content: space-between; font-size: .8rem; color: var(--g2); gap: 1rem; flex-wrap: wrap; }

    .img-failed { background: var(--g1); min-height: 240px; color: transparent; }

    html.motion [data-reveal] { opacity: 0; transform: translateX(-24px); transition: opacity .6s var(--ease), transform .8s var(--ease); transition-delay: var(--d, 0ms); }
    html.motion [data-reveal].is-in { opacity: 1; transform: none; }

    /* switcher */
    .switcher { position: fixed; right: 16px; bottom: 16px; z-index: 60; display: flex; flex-direction: column; align-items: flex-end; }
    .switcher__toggle { order: 2; background: var(--black); color: var(--white); border: 0; padding: .75rem 1rem; font-weight: 700; font-size: .88rem; cursor: pointer; display: flex; align-items: center; gap: .6rem; }
    .switcher__toggle::before { content: ""; width: 10px; height: 10px; background: var(--red); border-radius: 50%; }
    .switcher__panel { order: 1; display: grid; background: var(--white); border: 2px solid var(--black); min-width: 240px; counter-reset: s; }
    .switcher__panel[hidden] { display: none; }
    .switcher__link { padding: .55rem .9rem; font-weight: 500; font-size: .9rem; border-bottom: 1px solid var(--g1); counter-increment: s; }
    .switcher__link::before { content: counter(s, decimal-leading-zero) "  "; color: var(--g2); white-space: pre; }
    .switcher__link:hover { background: var(--g1); }
    .switcher__link[aria-current="page"] { color: var(--red); font-weight: 700; }
    .switcher__link--all::before { content: "→  "; }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .grid > * { grid-column: 1 / -1 !important; grid-row: auto !important; }
      .hero-meta { grid-template-columns: repeat(2, 1fr); row-gap: .75rem; } .hero-meta span { grid-column: span 1; }
      .hero-block { width: 30%; } .hero-photo { margin-top: 2rem; }
      .story, .facts, .f2 { margin-top: 2rem; }
      .facts { grid-template-columns: repeat(2, 1fr); }
      .menu-block, .item { grid-template-columns: 1fr auto; }
      .menu-block h3, .items { grid-column: 1 / -1; } .menu-block h3 { margin-bottom: 1rem; }
      .item strong { grid-column: 1; } .item .price { grid-column: 2; } .item p { grid-column: 1 / -1; grid-row: 2; }
      .origin { margin-bottom: 3rem; }
      .gallery .ph { grid-column: span 2 !important; aspect-ratio: 1 !important; }
      .gallery .p1, .gallery .p5 { grid-column: 1 / -1 !important; aspect-ratio: 3 / 2 !important; }
      .hours { margin-top: 2rem; }
      .nav-links { display: none; }
      .brand { grid-column: 1 / 3 !important; } .order { grid-column: 3 / 5 !important; }
    }
    @media (max-width: 900px) {
      .site-nav .grid { height: auto; padding-top: .7rem; padding-bottom: .7rem; row-gap: .5rem; }
      .nav-links { display: flex !important; order: 3; overflow-x: auto; scrollbar-width: none; }
      .nav-links::-webkit-scrollbar { display: none; }
      .nav-links li { flex: none; }
    }
    @media (max-width: 640px) {
      input { font-size: 16px !important; }
      .switcher { right: .75rem; bottom: .75rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="site-nav" id="top"></header>
  <main>
    <section id="hero"></section>
    <section id="about" class="section"></section>
    <section id="menu" class="section"></section>
    <section id="origins" class="section"></section>
    <section id="gallery" class="section"></section>
    <section id="visit" class="section"></section>
  </main>
  <footer id="footer"></footer>

  <script src="../shared/content.js"></script>
  <script src="../shared/images.js"></script>
  <script src="../shared/switcher.js"></script>
  <script>
    (function () {
      var C = window.CAFE, I = window.IMAGES;
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!reduce) document.documentElement.classList.add('motion');
      function img(e, w, eager) { return '<img src="' + window.imgSrc(e, w) + '" alt="' + e.alt + '" loading="' + (eager ? 'eager' : 'lazy') + '" decoding="async">'; }
      function money(p) { return C.currency + p; }
      function $(id) { return document.getElementById(id); }
      function d(i) { return ' data-reveal style="--d:' + (i * 80) + 'ms"'; }
      function top(n, t) { return '<div class="top" data-top><span class="n">' + n + '</span><h2>' + t + '</h2></div>'; }
      var today = (function () { var n = new Date().getDay(); return n === 0 ? 2 : n === 6 ? 1 : 0; })();

      $('top').innerHTML = '<div class="grid"><a class="brand" href="#top">' + C.shortName + '</a>' +
        '<ul class="nav-links">' + C.nav.map(function (n, i) { return '<li><a href="' + n.href + '"><span class="i">0' + (i + 1) + '</span>' + n.label + '</a></li>'; }).join('') + '</ul>' +
        '<a class="order" href="#menu">' + C.cta.order + '</a></div>';

      $('hero').innerHTML = '<div class="grid">' +
        '<div class="hero-meta"><span>Roastery &amp; espresso bar</span><span>Est. ' + C.facts[0].value + '</span><span>' + C.address.city + '</span><span>Open daily</span></div>' +
        '<h1 class="hero-title">' + C.name.split(' ').map(function (w, i) { return '<span class="w"' + d(i) + '>' + w + '</span>'; }).join('') + '</h1>' +
        '<div class="hero-photo"' + d(2) + '>' + img(I.hero, 1100, true) + '</div>' +
        '<div class="hero-block"' + d(3) + '></div>' +
        '<div class="hero-copy"' + d(4) + '><p>' + C.tagline + ' ' + C.intro.split('. ').slice(1, 2).join('') + '.</p><a href="#menu">' + C.cta.order + '</a></div></div>';

      $('about').innerHTML = '<div class="grid">' + top('01', 'Story') +
        '<div class="about-photo"' + d(0) + '>' + img(I.about, 900) + '</div>' +
        '<div class="story"' + d(1) + '>' + C.story.map(function (p) { return '<p>' + p + '</p>'; }).join('') + '</div>' +
        '<div class="facts">' + C.facts.map(function (f, i) { return '<div class="fact"' + d(i) + '><b data-count>' + f.value + '</b><span class="small muted">' + f.label + '</span></div>'; }).join('') + '</div></div>';

      $('menu').innerHTML = '<div class="grid">' + top('02', 'Menu') +
        C.menu.map(function (c, ci) {
          return '<div class="menu-block"' + d(0) + '><h3><span>0' + (ci + 1) + '</span>' + c.category + '</h3><div class="items">' + c.items.map(function (it) {
            return '<div class="item"><strong>' + it.name + '</strong><p>' + it.desc + '</p><span class="price">' + money(it.price) + '</span></div>';
          }).join('') + '</div></div>';
        }).join('') + '</div>';

      $('origins').innerHTML = '<div class="grid">' + top('03', 'Single origins') +
        C.origins.map(function (o, i) {
          return '<article class="origin"' + d(i) + '><div class="ph">' + img(I.origins[i], 800) + '</div><span class="k">Origin 0' + (i + 1) + '</span>' +
            '<h3>' + o.name + '</h3><p class="notes">' + o.notes.join(', ') + '</p>' +
            '<dl><dt>Region</dt><dd>' + o.region + '</dd><dt>Producer</dt><dd>' + o.producer + '</dd><dt>Process</dt><dd>' + o.process + '</dd><dt>Altitude</dt><dd>' + o.altitude + '</dd></dl>' +
            '<div class="buy"><span>' + o.weight + '</span><span>' + money(o.price) + '</span></div></article>';
        }).join('') + '</div>';

      $('gallery').innerHTML = '<div class="grid gallery">' + top('04', 'Space') +
        I.gallery.map(function (g, i) { return '<figure class="ph p' + (i + 1) + '"' + d(i % 3) + '>' + img(g, 1000) + '</figure>'; }).join('') + '</div>';

      $('visit').innerHTML = '<div class="grid">' + top('05', 'Visit') +
        '<p class="addr"' + d(0) + '>' + C.address.street + '<br>' + C.address.area + '<br>' + C.address.city + '</p>' +
        '<table class="hours"' + d(1) + '><tbody>' + C.hours.map(function (h, i) {
          return '<tr' + (i === today ? ' class="today"' : '') + '><td>' + h.days + '</td><td>' + h.open + '–' + h.close + '</td></tr>';
        }).join('') + '</tbody></table>' +
        '<div class="contact"><span>' + C.phone + '</span><span>' + C.email + '</span></div>' +
        '<div class="visit-photo"' + d(2) + '>' + img(I.visit, 1000) + '</div></div>';

      $('footer').innerHTML = '<div class="grid"><div class="f1"><h2>' + C.newsletter.heading + '</h2><p>' + C.newsletter.text + '</p>' +
        '<form class="signup" onsubmit="event.preventDefault()"><input type="email" aria-label="Email address" placeholder="Email address" required><button type="submit">' + C.newsletter.cta + '</button></form></div>' +
        '<ul class="f2">' + C.socials.map(function (s) { return '<li><a href="' + s.href + '">' + s.label + '</a><span>↗</span></li>'; }).join('') + '</ul>' +
        '<div class="legal"><span>© ' + new Date().getFullYear() + ' ' + C.name + '</span><a href="#top">Top ↑</a></div></div>';

      window.guardImages(document);
      window.mountSwitcher('swiss');

      if (!reduce && 'IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (es) {
          es.forEach(function (e) {
            if (!e.isIntersecting) return;
            e.target.classList.add('is-in'); io.unobserve(e.target);
            var c = e.target.querySelector && e.target.querySelector('[data-count]'); if (c) countUp(c);
          });
        }, { rootMargin: '0px 0px -8% 0px' });
        document.querySelectorAll('[data-reveal], [data-top]').forEach(function (el) { io.observe(el); });
      }
      function countUp(el) {
        var m = el.textContent.match(/^(\d+)(.*)$/); if (!m) return;
        var end = +m[1], start = end > 1000 ? end - 30 : 0, t0 = null;
        function step(t) { t0 = t0 || t; var p = Math.min((t - t0) / 1000, 1), e = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(start + (end - start) * e) + m[2]; if (p < 1) requestAnimationFrame(step); }
        requestAnimationFrame(step);
      }
    })();
  </script>
</body>
</html>
