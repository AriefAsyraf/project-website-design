<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halcyon Coffee Roasters — Flat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <style>
    :root { --white:#ffffff; --sand:#f4f1ec; --navy:#1e2a3a; --coral:#ff6b4a; --yellow:#ffc93c; --teal:#3ec1a4; --blue:#5b8def; --pop: cubic-bezier(.34,1.56,.64,1); }
    *, *::before, *::after { box-sizing: border-box; }
    /* mobile hardening */
    html { -webkit-text-size-adjust: 100%; }
    body { overflow-wrap: break-word; }
    .switcher__panel { max-height: calc(100vh - 6rem); overflow-y: auto; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--white); color: var(--navy); font-family: 'Poppins', sans-serif; font-size: 1.02rem; line-height: 1.6; }
    button, input { font: inherit; color: inherit; }
    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3, p { margin: 0; }
    h1, h2, h3 { font-weight: 700; line-height: 1.1; letter-spacing: -.01em; }
    :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 clamp(1rem, 4vw, 2rem); }
    .section { padding: clamp(4rem, 8vw, 6.5rem) 0; }
    .eyebrow { display: inline-block; background: var(--yellow); color: var(--navy); font-weight: 600; font-size: .8rem; padding: .3rem .9rem; border-radius: 999px; margin-bottom: 1rem; }
    h2 { font-size: clamp(2.1rem, 5vw, 3.3rem); margin-bottom: clamp(2rem, 4vw, 3rem); }
    .btn { display: inline-flex; align-items: center; gap: .5rem; padding: .85rem 1.6rem; border-radius: 999px; font-weight: 600; background: var(--coral); color: var(--white); border: 2px solid var(--coral); transition: background .2s, color .2s, transform .2s; }
    .btn:hover { background: var(--navy); border-color: var(--navy); transform: translateY(-2px); }
    .btn--line { background: transparent; color: var(--navy); border-color: var(--navy); }
    .btn--line:hover { background: var(--navy); color: var(--white); }
    .icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; }
    .icon svg { width: 24px; height: 24px; }

    /* nav */
    .site-nav { background: var(--white); position: sticky; top: 0; z-index: 30; }
    .site-nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 72px; gap: 1rem; }
    .logo { display: flex; align-items: center; gap: .6rem; font-weight: 700; font-size: 1.3rem; }
    .logo .icon { width: 38px; height: 38px; background: var(--coral); border-radius: 10px; }
    .nav-links { display: flex; gap: 2rem; list-style: none; margin: 0; padding: 0; font-weight: 500; }
    .nav-links a { transition: color .2s; } .nav-links a:hover { color: var(--coral); }
    .site-nav .btn { padding: .6rem 1.3rem; }

    /* hero */
    #hero { display: grid; grid-template-columns: 1fr 1fr; min-height: min(86vh, 760px); }
    .hero-left { background: var(--sand); display: flex; align-items: center; padding: clamp(3rem, 6vw, 5rem) clamp(1rem, 5vw, 5rem); }
    .hero-left > div { max-width: 520px; margin-left: auto; }
    .hero-title { font-size: clamp(2.6rem, 5.8vw, 4.6rem); overflow-wrap: break-word; }
    .hero-title span { color: var(--coral); }
    .hero-copy { margin: 1.25rem 0 2rem; font-size: 1.12rem; color: var(--navy); max-width: 42ch; }
    .hero-ctas { display: flex; gap: 1rem; flex-wrap: wrap; }
    .hero-stats { display: flex; gap: 2rem; margin-top: 2.5rem; flex-wrap: wrap; }
    .hero-stats b { display: block; font-size: 1.7rem; font-weight: 700; }
    .hero-stats span { font-size: .85rem; }
    .hero-right { background: var(--teal); position: relative; overflow: hidden; display: grid; place-items: center; padding: 2rem; }
    .illo { width: min(100%, 520px); height: auto; position: relative; z-index: 1; }
    html.motion .illo .steam { animation: float 3s ease-in-out infinite; }
    html.motion .illo .steam:nth-child(2) { animation-delay: -1s; } html.motion .illo .steam:nth-child(3) { animation-delay: -2s; }
    @keyframes float { 50% { transform: translateY(-10px); } }
    .hero-photo { position: absolute; right: 8%; bottom: 8%; width: clamp(120px, 16vw, 200px); aspect-ratio: 1; border-radius: 50%; overflow: hidden; border: 8px solid var(--white); z-index: 2; }
    .hero-photo img { width: 100%; height: 100%; object-fit: cover; }

    /* about */
    .about-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: clamp(2rem, 5vw, 4rem); align-items: center; }
    .story p + p { margin-top: 1rem; }
    .story p:first-child { font-size: 1.25rem; font-weight: 500; }
    .about-photo { border-radius: 24px; overflow: hidden; aspect-ratio: 4 / 3; background: var(--blue); }
    .about-photo img { width: 100%; height: 100%; object-fit: cover; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.25rem; margin-top: clamp(2.5rem, 5vw, 3.5rem); }
    .stat { border-radius: 20px; padding: 1.5rem; color: var(--navy); }
    .stat:nth-child(1) { background: var(--coral); color: var(--white); } .stat:nth-child(2) { background: var(--yellow); }
    .stat:nth-child(3) { background: var(--teal); } .stat:nth-child(4) { background: var(--blue); color: var(--white); }
    .stat .icon { background: var(--white); margin-bottom: 1rem; }
    .stat .icon svg { fill: var(--navy); }
    .stat b { display: block; font-size: 2rem; font-weight: 700; line-height: 1.1; }
    .stat span { font-size: .9rem; font-weight: 500; }

    /* menu */
    #menu { background: var(--sand); }
    .tabs { display: flex; gap: .75rem; flex-wrap: wrap; margin-bottom: 2rem; }
    .tab { border: 0; padding: .7rem 1.4rem; border-radius: 999px; font-weight: 600; background: var(--white); cursor: pointer; transition: background .2s, color .2s, transform .2s; }
    .tab:hover { transform: translateY(-2px); }
    .tab[aria-selected="true"] { background: var(--navy); color: var(--white); }
    .panel-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; align-items: start; }
    .items { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
    html.motion .panel:not([hidden]) .item { animation: pop .45s var(--pop) both; animation-delay: calc(var(--i) * 60ms); }
    @keyframes pop { from { opacity: 0; transform: scale(.9); } }
    .item { background: var(--white); border-radius: 18px; padding: 1.25rem; display: grid; grid-template-columns: auto 1fr auto; gap: 1rem; align-items: start; }
    .item .icon { width: 46px; height: 46px; }
    .item strong { display: block; font-weight: 600; overflow-wrap: anywhere; }
    .item p { font-size: .88rem; color: var(--navy); opacity: .8; }
    .pill { padding: .25rem .75rem; border-radius: 999px; font-weight: 600; font-size: .9rem; white-space: nowrap; }
    .menu-photo { border-radius: 24px; overflow: hidden; aspect-ratio: 3 / 4; background: var(--coral); }
    .menu-photo img { width: 100%; height: 100%; object-fit: cover; }

    /* origins */
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
    .card { border-radius: 24px; overflow: hidden; background: var(--sand); transition: transform .25s; }
    .card:hover { transform: translateY(-6px); }
    .band { height: 14px; }
    .card .ph { aspect-ratio: 4 / 3; overflow: hidden; }
    .card .ph img { width: 100%; height: 100%; object-fit: cover; }
    .card .body { padding: 1.5rem; }
    .card h3 { font-size: 1.45rem; }
    .chips { display: flex; flex-wrap: wrap; gap: .4rem; margin: .8rem 0 1rem; }
    .chip { padding: .2rem .7rem; border-radius: 999px; font-size: .8rem; font-weight: 600; background: var(--white); }
    .card dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: .3rem .9rem; font-size: .88rem; }
    .card dt { font-weight: 600; } .card dd { margin: 0; }
    .card .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 1.25rem; }
    .card .foot b { font-size: 1.3rem; }

    /* gallery */
    .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
    .tile { border-radius: 24px; padding: 14px; }
    .tile:nth-child(1) { background: var(--yellow); } .tile:nth-child(2) { background: var(--teal); } .tile:nth-child(3) { background: var(--coral); }
    .tile:nth-child(4) { background: var(--blue); } .tile:nth-child(5) { background: var(--sand); } .tile:nth-child(6) { background: var(--navy); }
    .tile .ph { border-radius: 14px; overflow: hidden; aspect-ratio: 1; }
    .tile .ph img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
    .tile:hover .ph img { transform: scale(1.05); }

    /* visit */
    #visit { background: var(--sand); }
    .visit-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 1.5rem; align-items: stretch; }
    .map { border-radius: 24px; overflow: hidden; background: var(--teal); min-height: 360px; }
    .map svg { width: 100%; height: 100%; display: block; }
    html.motion .map .pinmark { animation: drop 1.8s var(--pop) infinite alternate; transform-origin: center bottom; transform-box: fill-box; }
    @keyframes drop { to { transform: translateY(-10px); } }
    .info { background: var(--white); border-radius: 24px; padding: 2rem; display: grid; gap: 1.5rem; align-content: start; }
    .info .row { display: flex; gap: 1rem; align-items: start; }
    .info .row .icon { flex: none; }
    .info h3 { font-size: 1.1rem; margin-bottom: .2rem; }
    .hours { width: 100%; border-collapse: collapse; }
    .hours td { padding: .35rem 0; }
    .hours td:last-child { text-align: right; font-weight: 600; }
    .hours .today td { color: var(--coral); }
    .hours .today td:first-child::after { content: " • Today"; font-size: .8rem; }

    /* footer */
    footer { background: var(--navy); color: var(--white); padding: clamp(3.5rem, 7vw, 5rem) 0 2rem; }
    .foot-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 2.5rem; align-items: end; }
    .foot-grid h2 { margin-bottom: .5rem; }
    .signup { display: flex; gap: .75rem; margin-top: 1.5rem; flex-wrap: wrap; }
    .signup input { flex: 1; min-width: 0; border: 0; border-radius: 999px; padding: .85rem 1.3rem; background: var(--white); color: var(--navy); }
    .socials { list-style: none; margin: 0; padding: 0; display: flex; gap: .75rem; justify-content: flex-end; flex-wrap: wrap; }
    .socials a { display: block; padding: .55rem 1.1rem; border-radius: 999px; font-weight: 600; transition: transform .2s; }
    .socials li:nth-child(1) a { background: var(--coral); } .socials li:nth-child(2) a { background: var(--teal); color: var(--navy); } .socials li:nth-child(3) a { background: var(--yellow); color: var(--navy); }
    .socials a:hover { transform: translateY(-3px); }
    .legal { margin-top: 3rem; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; font-size: .85rem; }

    .img-failed { background: var(--yellow); min-height: 220px; color: transparent; }

    html.motion [data-reveal] { opacity: 0; transform: scale(.92); transition: opacity .4s ease, transform .5s var(--pop); transition-delay: var(--d, 0ms); }
    html.motion [data-reveal].is-in { opacity: 1; transform: none; }

    /* switcher */
    .switcher { position: fixed; right: 1rem; bottom: 1rem; z-index: 60; display: flex; flex-direction: column; align-items: flex-end; gap: .6rem; }
    .switcher__toggle { order: 2; display: flex; align-items: center; gap: .5rem; background: var(--coral); color: var(--white); border: 0; border-radius: 999px; padding: .75rem 1.2rem; font-weight: 600; cursor: pointer; transition: background .2s, transform .2s; }
    .switcher__toggle::before { content: ""; width: 14px; height: 14px; background: conic-gradient(var(--white) 0 25%, transparent 0 50%, var(--white) 0 75%, transparent 0); border-radius: 3px; }
    .switcher__toggle:hover { background: var(--navy); transform: translateY(-2px); }
    .switcher__panel { order: 1; display: grid; background: var(--white); border-radius: 20px; padding: .6rem; min-width: 230px; border: 2px solid var(--sand); }
    .switcher__panel[hidden] { display: none; }
    .switcher__link { display: flex; align-items: center; gap: .65rem; padding: .5rem .75rem; border-radius: 12px; font-weight: 500; font-size: .95rem; }
    .switcher__link::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--teal); }
    .switcher__link:nth-child(3n+2)::before { background: var(--coral); } .switcher__link:nth-child(3n)::before { background: var(--yellow); }
    .switcher__link:hover { background: var(--sand); }
    .switcher__link[aria-current="page"] { background: var(--navy); color: var(--white); }
    .switcher__link--all::before { background: var(--blue) !important; }

    @media (max-width: 900px) {
      #hero { grid-template-columns: 1fr; }
      .hero-left > div { margin: 0; }
      .about-grid, .panel-grid, .visit-grid, .foot-grid { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .cards, .items { grid-template-columns: 1fr; }
      .gallery { grid-template-columns: repeat(2, 1fr); }
      .menu-photo { aspect-ratio: 16 / 9; }
      .socials { justify-content: flex-start; }
    }
    @media (max-width: 640px) {
      .nav-links { display: none; }
      .gallery { gap: .9rem; } .tile { padding: 8px; border-radius: 18px; }
      .item { grid-template-columns: auto 1fr; } .item .pill { grid-column: 2; justify-self: start; }
    }
    /* mobile: nav links become a swipeable row */
    @media (max-width: 640px) {
      .site-nav .wrap { flex-wrap: wrap; height: auto; row-gap: .4rem; padding-top: .6rem; padding-bottom: .6rem; }
      .nav-links { display: flex !important; order: 3; width: 100%; overflow-x: auto; gap: 1.25rem; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
      .nav-links::-webkit-scrollbar { display: none; }
      .nav-links li { flex: none; }
    }
    @media (max-width: 640px) {
      input { font-size: 16px !important; }
      .switcher { right: .75rem; bottom: .75rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="site-nav" id="top"></header>
  <main>
    <section id="hero"></section>
    <section id="about" class="section"></section>
    <section id="menu" class="section"></section>
    <section id="origins" class="section"></section>
    <section id="gallery" class="section"></section>
    <section id="visit" class="section"></section>
  </main>
  <footer id="footer"></footer>

  <script src="../shared/content.js"></script>
  <script src="../shared/images.js"></script>
  <script src="../shared/switcher.js"></script>
  <script>
    (function () {
      var C = window.CAFE, I = window.IMAGES;
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!reduce) document.documentElement.classList.add('motion');
      function img(e, w, eager) { return '<img src="' + window.imgSrc(e, w) + '" alt="' + e.alt + '" loading="' + (eager ? 'eager' : 'lazy') + '" decoding="async">'; }
      function money(p) { return C.currency + p; }
      function $(id) { return document.getElementById(id); }
      function d(i) { return ' data-reveal style="--d:' + (i * 90) + 'ms"'; }
      var fills = ['var(--coral)', 'var(--yellow)', 'var(--teal)', 'var(--blue)'];
      var ic = {
        cup: '<svg viewBox="0 0 24 24"><path d="M3 8h14v6a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5zM17 10h1.5a2.5 2.5 0 0 1 0 5H17v-2h1.5a.5.5 0 0 0 0-1H17z"/></svg>',
        leaf: '<svg viewBox="0 0 24 24"><path d="M5 19C5 10 10 5 20 4c-1 10-6 15-15 15zm0 0l7-7"/></svg>',
        bean: '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="6.5" ry="9" transform="rotate(35 12 12)"/></svg>',
        heart: '<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
        drop: '<svg viewBox="0 0 24 24"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/></svg>',
        pin: '<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7zm0 4.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>',
        clock: '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm-1 5v6l5 3 1-1.6-4-2.4V7z"/></svg>',
        mail: '<svg viewBox="0 0 24 24"><path d="M3 5h18v14H3zm2 2v.5l7 5 7-5V7l-7 5z"/></svg>'
      };
      function icon(name, bg, fg) { return '<span class="icon" style="background:' + bg + '">' + ic[name].replace('<svg', '<svg style="fill:' + (fg || 'var(--white)') + '"') + '</span>'; }
      var today = (function () { var n = new Date().getDay(); return n === 0 ? 2 : n === 6 ? 1 : 0; })();
      var words = C.name.split(' ');

      $('top').innerHTML = '<div class="wrap"><a class="logo" href="#top">' + icon('cup', 'var(--coral)') + C.shortName + '</a>' +
        '<ul class="nav-links">' + C.nav.map(function (n) { return '<li><a href="' + n.href + '">' + n.label + '</a></li>'; }).join('') + '</ul>' +
        '<a class="btn" href="#menu">' + C.cta.order + '</a></div>';

      $('hero').innerHTML = '<div class="hero-left"><div><span class="eyebrow"' + d(0) + '>Specialty coffee · ' + C.address.area + '</span>' +
        '<h1 class="hero-title"' + d(1) + '>' + words[0] + ' <span>' + words.slice(1).join(' ') + '</span></h1>' +
        '<p class="hero-copy"' + d(2) + '>' + C.tagline + ' ' + C.intro.split('. ')[0] + '.</p>' +
        '<div class="hero-ctas"' + d(3) + '><a class="btn" href="#menu">' + C.cta.order + ' →</a><a class="btn btn--line" href="#visit">' + C.cta.visit + '</a></div>' +
        '<div class="hero-stats"' + d(4) + '>' + C.facts.slice(1, 4).map(function (f) { return '<div><b>' + f.value + '</b><span>' + f.label + '</span></div>'; }).join('') + '</div></div></div>' +
        '<div class="hero-right">' +
          '<svg class="illo" viewBox="0 0 400 400" aria-hidden="true">' +
            '<circle cx="300" cy="90" r="46" fill="var(--yellow)"/><circle cx="200" cy="215" r="150" fill="var(--blue)"/>' +
            '<rect x="40" y="318" width="320" height="22" rx="11" fill="var(--white)"/>' +
            '<path class="steam" d="M160 120c-14-18 14-28 0-48" stroke="var(--white)" stroke-width="10" fill="none" stroke-linecap="round"/>' +
            '<path class="steam" d="M200 120c-14-18 14-28 0-48" stroke="var(--yellow)" stroke-width="10" fill="none" stroke-linecap="round"/>' +
            '<path class="steam" d="M240 120c-14-18 14-28 0-48" stroke="var(--white)" stroke-width="10" fill="none" stroke-linecap="round"/>' +
            '<path d="M110 150h180v90a70 70 0 0 1-70 70h-40a70 70 0 0 1-70-70z" fill="var(--navy)"/>' +
            '<path d="M290 175h20a35 35 0 0 1 0 70h-24v-22h24a13 13 0 0 0 0-26h-20z" fill="var(--navy)"/>' +
            '<rect x="110" y="150" width="180" height="22" fill="var(--coral)"/><circle cx="200" cy="235" r="26" fill="var(--coral)"/>' +
          '</svg><div class="hero-photo"' + d(3) + '>' + img(I.menu, 500, true) + '</div></div>';

      var statIcons = ['heart', 'leaf', 'bean', 'cup'];
      $('about').innerHTML = '<div class="wrap"><div class="about-grid"><div><span class="eyebrow"' + d(0) + '>Our story</span><h2' + d(1) + '>Good coffee, simply done.</h2>' +
        '<div class="story"' + d(2) + '>' + C.story.map(function (p) { return '<p>' + p + '</p>'; }).join('') + '</div></div>' +
        '<div class="about-photo"' + d(2) + '>' + img(I.about, 900) + '</div></div>' +
        '<div class="stats">' + C.facts.map(function (f, i) { return '<div class="stat"' + d(i) + '>' + icon(statIcons[i], 'var(--white)', 'var(--navy)') + '<b>' + f.value + '</b><span>' + f.label + '</span></div>'; }).join('') + '</div></div>';

      var menuIcons = ['cup', 'drop', 'heart'], menuPhotos = [I.menu, I.iced, I.pastry];
      $('menu').innerHTML = '<div class="wrap"><span class="eyebrow"' + d(0) + '>Menu</span><h2' + d(1) + '>What are you in the mood for?</h2>' +
        '<div class="tabs" role="tablist" aria-label="Menu categories"' + d(2) + '>' + C.menu.map(function (c, i) {
          return '<button class="tab" role="tab" id="tab-' + i + '" aria-controls="panel-' + i + '" aria-selected="' + (i === 0) + '"' + (i ? ' tabindex="-1"' : '') + '>' + c.category + '</button>';
        }).join('') + '</div>' +
        C.menu.map(function (c, ci) {
          return '<div class="panel" role="tabpanel" id="panel-' + ci + '" aria-labelledby="tab-' + ci + '"' + (ci ? ' hidden' : '') + '><div class="panel-grid"><div class="items">' +
            c.items.map(function (it, i) {
              return '<div class="item" style="--i:' + i + '">' + icon(menuIcons[ci], fills[i % 4], i % 4 === 1 ? 'var(--navy)' : 'var(--white)') +
                '<div><strong>' + it.name + '</strong><p>' + it.desc + '</p></div><span class="pill" style="background:' + fills[(i + 1) % 4] + '">' + money(it.price) + '</span></div>';
            }).join('') + '</div><div class="menu-photo">' + img(menuPhotos[ci], 700) + '</div></div></div>';
        }).join('') + '</div>';

      var bands = ['var(--coral)', 'var(--teal)', 'var(--yellow)'];
      $('origins').innerHTML = '<div class="wrap"><span class="eyebrow"' + d(0) + '>Single origins</span><h2' + d(1) + '>Beans from farms we know.</h2><div class="cards">' +
        C.origins.map(function (o, i) {
          return '<article class="card"' + d(i) + '><div class="band" style="background:' + bands[i] + '"></div><div class="ph">' + img(I.origins[i], 700) + '</div><div class="body">' +
            '<h3>' + o.name + '</h3><div class="chips">' + o.notes.map(function (n) { return '<span class="chip">' + n + '</span>'; }).join('') + '</div>' +
            '<dl><dt>Region</dt><dd>' + o.region + '</dd><dt>Producer</dt><dd>' + o.producer + '</dd><dt>Process</dt><dd>' + o.process + '</dd><dt>Altitude</dt><dd>' + o.altitude + '</dd></dl>' +
            '<div class="foot"><b>' + money(o.price) + '</b><span class="pill" style="background:' + bands[i] + '">' + o.weight + '</span></div></div></article>';
        }).join('') + '</div></div>';

      $('gallery').innerHTML = '<div class="wrap"><span class="eyebrow"' + d(0) + '>Gallery</span><h2' + d(1) + '>Come for the coffee, stay for the vibe.</h2><div class="gallery">' +
        I.gallery.map(function (g, i) { return '<div class="tile"' + d(i % 3) + '><div class="ph">' + img(g, 700) + '</div></div>'; }).join('') + '</div></div>';

      $('visit').innerHTML = '<div class="wrap"><span class="eyebrow"' + d(0) + '>Visit</span><h2' + d(1) + '>Find us in ' + C.address.area + '.</h2><div class="visit-grid">' +
        '<div class="map"' + d(2) + '><svg viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Map showing ' + C.address.street + '">' +
          '<rect width="600" height="400" fill="var(--teal)"/><rect x="0" y="170" width="600" height="46" fill="var(--white)"/><rect x="250" y="0" width="46" height="400" fill="var(--white)"/>' +
          '<rect x="40" y="40" width="170" height="100" rx="14" fill="var(--sand)"/><rect x="336" y="40" width="220" height="100" rx="14" fill="var(--yellow)"/>' +
          '<rect x="40" y="250" width="170" height="110" rx="14" fill="var(--blue)"/><rect x="336" y="250" width="220" height="110" rx="14" fill="var(--sand)"/>' +
          '<g class="pinmark"><path d="M330 110a34 34 0 0 1 34 34c0 26-34 58-34 58s-34-32-34-58a34 34 0 0 1 34-34z" fill="var(--coral)"/><circle cx="330" cy="144" r="12" fill="var(--white)"/></g></svg></div>' +
        '<div class="info"' + d(3) + '><div class="row">' + icon('pin', 'var(--coral)') + '<div><h3>Address</h3><p>' + C.address.street + '<br>' + C.address.area + ', ' + C.address.city + '</p></div></div>' +
          '<div class="row">' + icon('clock', 'var(--teal)') + '<div style="flex:1"><h3>Opening hours</h3><table class="hours"><tbody>' + C.hours.map(function (h, i) {
            return '<tr' + (i === today ? ' class="today"' : '') + '><td>' + h.days + '</td><td>' + h.open + ' – ' + h.close + '</td></tr>';
          }).join('') + '</tbody></table></div></div>' +
          '<div class="row">' + icon('mail', 'var(--blue)') + '<div><h3>Say hello</h3><p>' + C.phone + '<br>' + C.email + '</p></div></div></div></div></div>';

      $('footer').innerHTML = '<div class="wrap"><div class="foot-grid"><div><h2>' + C.newsletter.heading + '</h2><p>' + C.newsletter.text + '</p>' +
        '<form class="signup" onsubmit="event.preventDefault()"><input type="email" aria-label="Email address" placeholder="Your email" required><button class="btn" type="submit">' + C.newsletter.cta + '</button></form></div>' +
        '<ul class="socials">' + C.socials.map(function (s) { return '<li><a href="' + s.href + '">' + s.label + '</a></li>'; }).join('') + '</ul></div>' +
        '<div class="legal"><span>© ' + new Date().getFullYear() + ' ' + C.name + '</span><a href="#top">Back to top ↑</a></div></div>';

      // tabs
      var tabs = [].slice.call(document.querySelectorAll('.tab'));
      function select(i) {
        tabs.forEach(function (t, j) { t.setAttribute('aria-selected', String(i === j)); t.tabIndex = i === j ? 0 : -1; $('panel-' + j).hidden = i !== j; });
      }
      tabs.forEach(function (t, i) {
        t.addEventListener('click', function () { select(i); });
        t.addEventListener('keydown', function (e) {
          var k = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0; if (!k) return;
          var n = (i + k + tabs.length) % tabs.length; select(n); tabs[n].focus();
        });
      });

      window.guardImages(document);
      window.mountSwitcher('flat');

      if (!reduce && 'IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); } }); }, { rootMargin: '0px 0px -8% 0px' });
        document.querySelectorAll('[data-reveal]').forEach(function (el) { io.observe(el); });
      }
    })();
  </script>
</body>
</html>
